<svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
  <!-- PDR Text - Bold, modern curved styling -->
  <text x="50" y="80" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900" 
        text-anchor="start" fill="#1a1a1a" letter-spacing="-2">PDR</text>
  
  <!-- TEAM Text - Lighter weight -->
  <text x="50" y="120" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" 
        text-anchor="start" fill="#1a1a1a" letter-spacing="2">TEAM</text>
  
  <!-- Motion stripes - three horizontal lines -->
  <g fill="#1a1a1a">
    <rect x="50" y="130" width="30" height="6" rx="3"/>
    <rect x="50" y="139" width="40" height="6" rx="3"/>
    <rect x="50" y="148" width="25" height="6" rx="3"/>
  </g>
</svg>
