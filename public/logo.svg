<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- PDR Letters -->
  <text x="50" y="120" font-family="Arial, sans-serif" font-size="110" font-weight="900" fill="#1F4E79" letter-spacing="-8">PDR</text>
  
  <!-- Motion Stripes (3 parallelograms) -->
  <g fill="#1F4E79">
