<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Colibri Status Sheet</title>
<style>
  :root {
    --bg: #eef1f5;
    --paper: #ffffff;
    --fg: #1a1f2b;
    --muted: #5f6b7a;
    --line: #c9d1dc;
    --head: #2b65a0;
    --accent: #2b5ea7;
    --yes: #13814f;
    --yes-bg: #e3f4ea;
    --no: #c0352b;
    --no-bg: #fbe6e4;
    --warn: #b86e00;
    --warn-bg: #fff1d9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10141b; --paper: #1a202a; --fg: #eef2f7; --muted: #9aa6b5; --line: #2f3846;
      --head: #6fa6e0; --accent: #5b93d6; --yes: #3ccf87; --yes-bg: #143326; --no: #ff7b70; --no-bg: #3a1a18;
      --warn: #f2b24d; --warn-bg: #3a2b10; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10141b; --paper: #1a202a; --fg: #eef2f7; --muted: #9aa6b5; --line: #2f3846;
    --head: #6fa6e0; --accent: #5b93d6; --yes: #3ccf87; --yes-bg: #143326; --no: #ff7b70; --no-bg: #3a1a18;
    --warn: #f2b24d; --warn-bg: #3a2b10; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: Arial, Helvetica, sans-serif; line-height: 1.45; padding: 0 12px 40px; }
  .wrap { max-width: 720px; margin: 0 auto; }

  .topbar { display: flex; gap: 6px; padding: 12px 0; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .topbar button { flex: 1; padding: 10px 8px; border: 1px solid var(--line); background: var(--paper); color: var(--fg); border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .topbar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .sheet { background: var(--paper); border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 22px 20px 26px; }
  .sheet-head { display: flex; justify-content: flex-end; align-items: center; font-size: 14px; }
  .logo { width: 120px; background: #fff; border-radius: 4px; padding: 2px; }
  .logo img { width: 100%; height: auto; display: block; }
  .sheet h1 { text-align: center; color: var(--head); font-weight: 400; font-size: 26px; margin: 18px 0 10px; padding-bottom: 14px; border-bottom: 1px solid var(--fg); }
  .sheet h2 { color: var(--head); font-weight: 400; font-size: 20px; margin: 22px 0 8px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; align-items: center; padding: 6px 0; }
  .row > label, .row > .lbl { font-size: 15px; }
  .row.top { align-items: start; }
  .lbl em { color: var(--muted); font-style: normal; font-size: 13px; }
  input[type=text], input[type=date], textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: transparent;
    border: none; border-bottom: 1px solid var(--muted); padding: 6px 2px; border-radius: 0;
  }
  textarea { min-height: 44px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-bottom: 2px solid var(--accent); }
  input[readonly] { color: var(--fg); font-weight: 700; border-bottom-style: dotted; }

  .yn { display: flex; gap: 8px; }
  .yn label { flex: 1; max-width: 90px; position: relative; }
  .yn input { position: absolute; opacity: 0; pointer-events: none; }
  .yn span { display: block; text-align: center; padding: 8px 0; border: 1.5px solid var(--line); border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; user-select: none; }
  .yn input:checked + span.y { background: var(--yes-bg); border-color: var(--yes); color: var(--yes); }
  .yn input:checked + span.n { background: var(--no-bg); border-color: var(--no); color: var(--no); }
  .yn input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .item-note { display: none; margin-top: 6px; }
  .item-note.show { display: block; }
  .note-toggle { background: none; border: none; color: var(--accent); font: inherit; font-size: 13px; padding: 4px 0 0; cursor: pointer; text-align: left; }
  .missing .yn span { border-color: var(--warn); background: var(--warn-bg); }

  .sig-wrap { border-bottom: 1px solid var(--muted); position: relative; background: #fff; border-radius: 4px 4px 0 0; }
  #sigPad { width: 100%; height: 110px; display: block; touch-action: none; cursor: crosshair; }
  .sig-clear { position: absolute; right: 4px; top: 2px; background: none; border: none; color: #2b5ea7; font: inherit; font-size: 13px; cursor: pointer; }

  .btn { display: inline-block; padding: 12px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.block { width: 100%; margin-top: 24px; padding: 15px; font-size: 16px; }
  .error { color: var(--no); background: var(--no-bg); border-radius: 8px; padding: 10px 12px; font-size: 15px; font-weight: 700; margin-top: 14px; display: none; }

  .units { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .unit { background: var(--paper); border-radius: 10px; padding: 16px; cursor: pointer; border: 1px solid var(--line); }
  .unit h3 { margin: 0 0 4px; font-size: 18px; }
  .unit p { margin: 0; color: var(--muted); font-size: 14px; }
  .pill { display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
  .pill.ok { background: var(--yes-bg); color: var(--yes); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--no-bg); color: var(--no); }
  .sync { font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; }
  .sync:empty { display: none; }
  .badge { background: var(--warn-bg); color: var(--warn); border-radius: 99px; padding: 1px 8px; font-size: 11px; font-weight: 700; }
  .edited { color: var(--muted); font-size: 12px; font-style: italic; margin: 8px 0 0; }
  .btn.small { padding: 8px 14px; font-size: 14px; margin-top: 12px; }
  .intro { text-align: center; color: var(--muted); font-size: 14px; margin: -4px 0 0; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--yes); color: #fff; padding: 12px 20px; border-radius: 10px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.2); z-index: 20; }
  .sync.ok { background: var(--yes-bg); color: var(--yes); }
  .sync.local { background: var(--warn-bg); color: var(--warn); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  .log { border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; overflow: hidden; }
  .log summary { padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; list-style: none; }
  .log summary::-webkit-details-marker { display: none; }
  .log summary b { font-size: 15px; }
  .log summary small { color: var(--muted); }
  .log .body { padding: 4px 14px 14px; border-top: 1px solid var(--line); font-size: 14px; }
  .log .body h4 { color: var(--head); font-weight: 400; font-size: 16px; margin: 14px 0 4px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 3px 0; border-bottom: 1px dotted var(--line); }
  .kv .note { grid-column: 1 / -1; color: var(--muted); font-style: italic; }
  .tag-y { color: var(--yes); font-weight: 700; }
  .tag-n { color: var(--no); font-weight: 700; }
  .cmt { margin: 6px 0 0; white-space: pre-wrap; }
  .cmt::before { content: "Comments: "; color: var(--muted); }
  .cmt:empty { display: none; }
  .sig-img { max-width: 220px; max-height: 80px; background: #fff; border-radius: 4px; margin-top: 6px; }

  .qr-box { text-align: center; margin: 18px 0 6px; }
  .qr-box .qr { display: inline-block; background: #fff; padding: 12px; border-radius: 8px; }
  .qr-url { font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 6px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

  .page { display: none; }
  .page.active { display: block; }

  @media (max-width: 520px) {
    .row { grid-template-columns: 1fr; gap: 4px; }
    .yn label { max-width: none; }
    .sheet { padding: 18px 14px 22px; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .topbar, .actions, .btn { display: none !important; }
    .sheet { box-shadow: none; }
    details.log { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button data-nav="dashboard" class="active">Units</button>
    <button data-nav="add">Add Unit</button>
  </div>
  <div id="syncStatus" class="sync"></div>

  <section id="dashboard" class="page active"><div id="units" class="units"></div></section>
  <section id="detail" class="page"><div class="sheet" id="detailBody"></div></section>
  <section id="form" class="page"><div class="sheet" id="formBody"></div></section>

  <section id="add" class="page">
    <div class="sheet">
      <div class="sheet-head"><div class="logo"><img src="colibri-logo.jpg" alt="PDR Team"></div></div>
      <h1>Register Colibri</h1>
      <form id="addForm">
        <div class="row"><label for="newNumber">Colibri number:</label><input type="text" id="newNumber" placeholder="e.g. XL03" required></div>
        <div class="row"><label for="newLocation">Location:</label><input type="text" id="newLocation" placeholder="e.g. Lewisville"></div>
        <div class="row top"><label for="newComments">Comments:</label><textarea id="newComments"></textarea></div>
        <button class="btn block" type="submit">Create unit &amp; QR code</button>
      </form>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SW_ITEMS = [
  ['testScan',  'Test scan done', '(1-3 clean scans)'],
  ['roomCal',   'Room calibration done', '(intr. if necessary)'],
  ['swTested',  'SW thoroughly tested on this scanner', ''],
  ['pdfTested', 'PDF generation tested', '(all matrixes)'],
];
const MAINT_ITEMS = [
  ['accessories', 'Accessories checked', '(boxes)'],
  ['camera',      'Camera cleaned', '(with camera cleaner)'],
  ['interior',    'Interior sheet cleaned', ''],
  ['dustCover',   'Dust cover cleaned', '(in and outside)'],
  ['electronics', 'Electronics cleaned inside', '(if necessary)'],
  ['cabinet',     'Control cabinet cleaned', ''],
];

const state = { units: [], logs: [] };
let idb;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq = s => esc(String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.slice(0, 10).split('-'); return `${m}/${d}/${y}`; };

/* ---------- storage (IndexedDB, on this device) ---------- */
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('ColibriTracker', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('units')) d.createObjectStore('units', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('logs')) d.createObjectStore('logs', { keyPath: 'id', autoIncrement: true }).createIndex('unitNumber', 'unitNumber');
    };
    r.onsuccess = () => { idb = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
const tx = (store, mode, fn) => new Promise((res, rej) => {
  const t = idb.transaction(store, mode); const req = fn(t.objectStore(store));
  t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
});
// Fallback for browsers that block IndexedDB (private mode, QR-scanner in-app browsers)
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem('colibri.' + k) || '[]'); } catch (e) { return mem[k] || []; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem('colibri.' + k, JSON.stringify(v)); } catch (e) {} },
};
const mem = {};
const localPutUnit = async u => {
  if (idb) return tx('units', 'readwrite', s => s.put(u));
  const a = LS.get('units').filter(x => x.id !== u.id); a.push(u); LS.set('units', a);
};
const localPutLog = async l => {
  if (idb) return tx('logs', 'readwrite', s => s.put(l));
  const a = LS.get('logs').filter(x => x.id !== l.id); a.push(l); LS.set('logs', a);
};
const localAll = async () => idb
  ? { units: await tx('units', 'readonly', s => s.getAll()) || [], logs: await tx('logs', 'readonly', s => s.getAll()) || [] }
  : { units: LS.get('units'), logs: LS.get('logs') };

/* ---------- cloud (Supabase) – shared across all phones ---------- */
const SB_URL = 'https://jedolnkjmlrruipkgqyd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZG9sbmtqbWxycnVpcGtncXlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3ODk1ODQsImV4cCI6MjEwNjM2NTU4NH0.h3W7vimHuA_KPGmOjGN8HhM24k9apRta44l9D8xtF-Y';
async function sb(path, opts = {}) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${path}`, { ...opts, signal: ctl.signal,
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
    if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 150)}`);
    const txt = await r.text(); return txt ? JSON.parse(txt) : null;
  } finally { clearTimeout(t); }
}
const upsert = (table, rows, key) => sb(`${table}?on_conflict=${key}`, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(rows) });
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

let cloudOK = null;
function setCloud(ok, why) {
  cloudOK = ok;
  if (why) console.warn('Cloud sync:', why);
  const el = document.getElementById('syncStatus'); if (!el) return;
  const pending = state.logs.filter(l => !l.synced).length;
  el.className = 'sync ' + (ok ? 'ok' : 'local');
  el.textContent = ok ? 'Synced: sheets are shared with every phone'
    : `Saved on this phone only${pending ? ` (${pending} waiting)` : ''}. Will sync when the connection is back.`;
}
const unitRow = u => ({ number: u.number, location: u.location || '', comments: u.comments || '', created_at: u.createdAt || new Date().toISOString() });
const sheetRow = l => { const { id, synced, ...data } = l; return { id: l.id, unit_number: l.unitNumber, created_at: l.createdAt || new Date().toISOString(), data }; };

// Saves go to the phone first (instant), then upload in the background.
const putUnit = async u => {
  await localPutUnit(u);
  upsert('colibri_units', [unitRow(u)], 'number').then(() => setCloud(true), e => setCloud(false, e.message));
};
// add a new sheet, or replace an existing one (same id) when editing
const addLog = async l => {
  if (!l.id) l.id = newId();
  l.synced = false;
  await localPutLog(l);
  const i = state.logs.findIndex(x => x.id === l.id);
  if (i >= 0) state.logs[i] = l; else state.logs.push(l);
  upsert('colibri_sheets', [sheetRow(l)], 'id')
    .then(async () => { l.synced = true; await localPutLog(l); setCloud(true); })
    .catch(e => setCloud(false, e.message));
};

async function load() {
  const local = await localAll();
  // give every old local record a string id so it can be uploaded
  for (const l of local.logs) if (typeof l.id !== 'string') { const old = l.id; l.id = 'local-' + old; if (idb) await tx('logs', 'readwrite', s => s.delete(old)); await localPutLog(l); }
  try {
    const pending = local.logs.filter(l => !l.synced && l.sw);
    if (pending.length) { await upsert('colibri_sheets', pending.map(sheetRow), 'id'); for (const l of pending) { l.synced = true; await localPutLog(l); } }
    if (local.units.length) await upsert('colibri_units', local.units.map(unitRow), 'number');
    const [units, sheets] = await Promise.all([sb('colibri_units?select=*'), sb('colibri_sheets?select=*&order=created_at.desc')]);
    state.units = units.map(r => ({ id: r.number, number: r.number, location: r.location, comments: r.comments, createdAt: r.created_at }));
    state.logs = sheets.map(r => ({ ...r.data, id: r.id, unitNumber: r.unit_number, synced: true }));
    for (const u of local.units) if (!state.units.some(x => x.number === u.number)) state.units.push(u);
    setCloud(true);
  } catch (e) {
    state.units = local.units; state.logs = local.logs.filter(l => l.sw);
    setCloud(false, e.message);
  }
}
// newest work date first (so past records slot into the right place)
const unitLogs = n => state.logs.filter(l => l.unitNumber === n)
  .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

/* ---------- navigation ---------- */
function show(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === id));
  document.querySelectorAll('.topbar button').forEach(b => b.classList.toggle('active', b.dataset.nav === id));
  window.scrollTo(0, 0);
}
document.querySelectorAll('.topbar button').forEach(b => b.onclick = () => {
  history.replaceState(null, '', location.pathname);
  if (b.dataset.nav === 'dashboard') renderDashboard();
  show(b.dataset.nav);
});

/* ---------- dashboard ---------- */
function renderDashboard() {
  const el = document.getElementById('units');
  if (!state.units.length) { el.innerHTML = '<div class="empty">No units yet. Tap “Add Unit”.</div>'; return; }
  el.innerHTML = state.units.map(u => {
    const logs = unitLogs(u.number), last = logs.find(l => l.sw);
    let pill = '<span class="pill warn">No status sheet yet</span>';
    if (last) {
      const days = Math.floor((Date.now() - new Date(last.date)) / 864e5);
      const open = [...Object.values(last.sw), ...Object.values(last.maint).map(m => m.value)].some(v => v !== 'yes');
      pill = days > 30 ? `<span class="pill bad">Last: ${days} days ago</span>`
           : open ? `<span class="pill warn">Open items · ${fmtDate(last.date)}</span>`
           : `<span class="pill ok">OK · ${fmtDate(last.date)}</span>`;
    }
    return `<div class="unit" onclick="openUnit('${jsq(u.number)}')">
      <h3>${esc(u.number)}</h3><p>${esc(u.location || '—')}</p>${pill}
      <p style="margin-top:8px;font-size:12px">${logs.length} sheet${logs.length === 1 ? '' : 's'}</p></div>`;
  }).join('');
}

/* ---------- unit detail ---------- */
const link = n => `${location.origin}${location.pathname}#unit=${encodeURIComponent(n)}`;
const ynTag = v => v === 'yes' ? '<span class="tag-y">YES</span>' : v === 'no' ? '<span class="tag-n">NO</span>' : '<span>—</span>';

function logHTML(l, open) {
  if (!l.sw) {
    return `<details class="log"><summary><b>${new Date(l.date).toLocaleDateString()}</b><small>${esc(l.technician || '')} · test entry (old format)</small></summary>
      <div class="body"><p class="cmt">${esc(l.comments || '')}</p></div></details>`;
  }
  const noCount = [...Object.values(l.sw), ...Object.values(l.maint).map(m => m.value)].filter(v => v === 'no').length;
  const tech = l.tech || l.name;
  return `<details class="log"${open ? ' open' : ''}>
    <summary><b>${fmtDate(l.date)} · ${esc(tech)}</b><small>${l.past ? '<span class="badge">past record</span> ' : ''}${noCount ? `<span class="tag-n">${noCount} × no</span>` : '<span class="tag-y">all yes</span>'} · SW ${esc(l.swVersion || '—')}</small></summary>
    <div class="body">
      <h4>Colibri information</h4>
      <div class="kv"><span>Location</span><span>${esc(l.location || '—')}</span></div>
      <p class="cmt">${esc(l.infoComments)}</p>
      <h4>Software (SW)</h4>
      <div class="kv"><span>Installed software version</span><span>${esc(l.swVersion || '—')}</span></div>
      ${SW_ITEMS.map(([k, t]) => `<div class="kv"><span>${t}</span>${ynTag(l.sw[k])}</div>`).join('')}
      <p class="cmt">${esc(l.swComments)}</p>
      <h4>Maintenance</h4>
      ${MAINT_ITEMS.map(([k, t]) => { const m = l.maint[k] || {}; return `<div class="kv"><span>${t}</span>${ynTag(m.value)}${m.note ? `<span class="note">${esc(m.note)}</span>` : ''}</div>`; }).join('')}
      <p class="cmt">${esc(l.maintComments)}</p>
      <h4>Approval</h4>
      <div class="kv"><span>Technician (work done by)</span><span>${esc(tech)}</span></div>
      <div class="kv"><span>Name</span><span>${esc(l.name)}</span></div>
      <div class="kv"><span>Date</span><span>${fmtDate(l.date)}</span></div>
      ${l.signature ? `<img class="sig-img" src="${l.signature}" alt="Signature">` : ''}
      ${l.updatedAt ? `<p class="edited">Edited ${new Date(l.updatedAt).toLocaleString()}${l.updatedBy ? ' by ' + esc(l.updatedBy) : ''}</p>` : ''}
      <button class="btn ghost small" onclick="openForm('${jsq(l.unitNumber)}', '${jsq(l.id)}')">Edit this sheet</button>
    </div></details>`;
}

function openUnit(n) {
  let u = state.units.find(x => x.number === n);
  if (!u) { u = { id: n, number: n, location: '', comments: '', createdAt: new Date().toISOString() }; state.units.push(u); putUnit(u); }
  const logs = unitLogs(n);
  document.getElementById('detailBody').innerHTML = `
    <div class="sheet-head"><div class="logo"><img src="colibri-logo.jpg" alt="PDR Team"></div></div>
    <h1>${esc(u.number)}</h1>
    <div class="row"><span class="lbl">Location:</span><span>${esc(u.location || '—')}</span></div>
    ${u.comments ? `<div class="row top"><span class="lbl">Comments:</span><span>${esc(u.comments)}</span></div>` : ''}
    <div class="actions"><button class="btn" onclick="openForm('${jsq(n)}')">+ New status sheet</button>
      <button class="btn ghost" onclick="openForm('${jsq(n)}', null, true)">+ Log past maintenance</button>
      <button class="btn ghost" onclick="window.print()">Print</button></div>
    <h2>Status sheet history</h2>
    ${logs.length ? logs.map((l, i) => logHTML(l, i === 0)).join('') : '<p style="color:var(--muted)">No status sheets yet.</p>'}
    <h2>QR code for this unit</h2>
    <div class="qr-box"><div class="qr" id="detailQR"></div><div class="qr-url">${esc(link(n))}</div></div>`;
  if (window.QRCode) new QRCode(document.getElementById('detailQR'), { text: link(n), width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
  show('detail');
}

/* ---------- status sheet form (new / past / edit) ---------- */
function ynRow(group, key, title, hint, withNote, cur, note) {
  const chk = v => cur === v ? ' checked' : '';
  return `<div class="row" data-item="${group}.${key}">
    <span class="lbl">${title}${hint ? ` <em>${hint}</em>` : ''}:</span>
    <div><div class="yn">
      <label><input type="radio" name="${group}.${key}" value="yes"${chk('yes')}><span class="y">yes</span></label>
      <label><input type="radio" name="${group}.${key}" value="no"${chk('no')}><span class="n">no</span></label>
    </div>${withNote ? (note
      ? `<input type="text" class="item-note show" name="${group}.${key}.note" value="${esc(note)}" placeholder="Note for this item">`
      : `<button type="button" class="note-toggle" onclick="const i=this.nextElementSibling;i.classList.add('show');i.focus();this.remove()">+ add note</button>
      <input type="text" class="item-note" name="${group}.${key}.note" placeholder="Note for this item">`) : ''}</div>
  </div>`;
}

function openForm(n, editId, pastMode) {
  let u = state.units.find(x => x.number === n);
  if (!u) { u = { id: n, number: n, location: '', comments: '', createdAt: new Date().toISOString() }; state.units.push(u); putUnit(u); }
  const ex = editId ? state.logs.find(l => l.id === editId) : null;
  const past = ex ? !!ex.past : !!pastMode;
  const last = unitLogs(n).find(l => l.sw);
  let savedName = ''; try { savedName = localStorage.getItem('colibriTechName') || ''; } catch (e) {}
  const v = {
    location: ex ? ex.location : u.location,
    infoComments: ex?.infoComments || '', swVersion: ex ? ex.swVersion : (past ? '' : last?.swVersion || ''),
    swComments: ex?.swComments || '', maintComments: ex?.maintComments || '',
    tech: ex ? (ex.tech || ex.name) : (past ? '' : savedName),
    name: ex ? ex.name : savedName,
    date: ex ? ex.date : (past ? '' : today()),
  };
  const title = ex ? 'Edit Status Sheet' : past ? 'Log Past Maintenance' : 'Colibri Status Sheet';
  const intro = ex ? `Editing the sheet from ${fmtDate(ex.date)}. Changes replace the saved version.`
    : past ? 'Enter a maintenance job that was already done: pick the date of the work and the technician who did it.'
    : last ? `Last sheet for ${esc(u.number)}: ${fmtDate(last.date)} by ${esc(last.tech || last.name)} · <a href="#" onclick="openUnit('${jsq(n)}');return false">view history</a>` : '';
  document.getElementById('formBody').innerHTML = `
    <div class="sheet-head"><div class="logo"><img src="colibri-logo.jpg" alt="PDR Team"></div></div>
    <h1>${title}</h1>
    ${intro ? `<p class="intro">${intro}</p>` : ''}
    <form id="sheetForm" novalidate>
      <h2>Colibri information</h2>
      <div class="row"><label>Colibri number:</label><input type="text" value="${esc(u.number)}" readonly></div>
      <div class="row"><label for="f_location">Location:</label><input type="text" id="f_location" value="${esc(v.location)}"></div>
      <div class="row top"><label for="f_infoComments">Comments:</label><textarea id="f_infoComments">${esc(v.infoComments)}</textarea></div>

      <h2>Software (SW)</h2>
      <div class="row"><label for="f_swVersion">Installed software version:</label><input type="text" id="f_swVersion" value="${esc(v.swVersion)}" placeholder="e.g. Release-2025-07"></div>
      ${SW_ITEMS.map(([k, t, h]) => ynRow('sw', k, t, h, false, ex?.sw?.[k])).join('')}
      <div class="row top"><label for="f_swComments">Comments:</label><textarea id="f_swComments">${esc(v.swComments)}</textarea></div>

      <h2>Maintenance</h2>
      ${MAINT_ITEMS.map(([k, t, h]) => ynRow('maint', k, t, h, true, ex?.maint?.[k]?.value, ex?.maint?.[k]?.note)).join('')}
      <div class="row top"><label for="f_maintComments">Comments:</label><textarea id="f_maintComments">${esc(v.maintComments)}</textarea></div>

      <h2>Approval</h2>
      <div class="row"><label for="f_tech">Technician <em>(work done by)</em>:</label><input type="text" id="f_tech" value="${esc(v.tech)}" placeholder="Who did the work"></div>
      <div class="row"><label for="f_name">Name:</label><input type="text" id="f_name" value="${esc(v.name)}" autocomplete="name"></div>
      <div class="row"><label for="f_date">Date${past ? ' <em>(of the work)</em>' : ''}:</label><input type="date" id="f_date" value="${esc(v.date)}" max="${today()}"></div>
      <div class="row top"><span class="lbl">Signature:${past ? ' <em>(optional)</em>' : ''}</span>
        <div>${ex?.signature ? `<img class="sig-img" src="${ex.signature}" alt="Saved signature"><p class="intro" style="text-align:left;margin:4px 0">Saved signature. Sign below only to replace it.</p>` : ''}
        <div class="sig-wrap"><canvas id="sigPad"></canvas><button type="button" class="sig-clear" id="sigClear">clear</button></div></div></div>

      <div class="error" id="formError"></div>
      <button class="btn block" type="submit">${ex ? 'Save changes' : past ? 'Save past maintenance' : 'Save status sheet'}</button>
      <button class="btn ghost block" type="button" style="margin-top:10px" onclick="openUnit('${jsq(n)}')">Cancel</button>
    </form>`;
  show('form');
  const sig = setupSignature();
  document.getElementById('sheetForm').addEventListener('change', e => e.target.closest('[data-item]')?.classList.remove('missing'));

  document.getElementById('sheetForm').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, err = document.getElementById('formError');
    const fail = (msg, el) => { err.textContent = msg; err.style.display = 'block'; if (el) el.focus(); };
    const val = name => f.querySelector(`input[name="${name}"]:checked`)?.value || null;
    const missing = [];
    f.querySelectorAll('[data-item]').forEach(r => {
      const has = !!val(r.dataset.item); r.classList.toggle('missing', !has); if (!has) missing.push(r);
    });
    const tech = document.getElementById('f_tech').value.trim();
    const name = document.getElementById('f_name').value.trim();
    const date = document.getElementById('f_date').value;
    const saveBtn = f.querySelector('button[type=submit]');
    if (!tech) return fail('Enter the technician who did the work.', document.getElementById('f_tech'));
    if (!name) return fail('Enter your name under Approval to save.', document.getElementById('f_name'));
    if (!date) return fail('Pick the date the work was done.', document.getElementById('f_date'));
    if (date > today()) return fail('The date can’t be in the future.', document.getElementById('f_date'));
    const msgs = [];
    if (missing.length) msgs.push(`${missing.length} item${missing.length > 1 ? 's' : ''} not answered (highlighted)`);
    if (sig.isEmpty() && !past && !ex?.signature) msgs.push('no signature');
    if (msgs.length && !f.dataset.confirmed) {
      f.dataset.confirmed = '1';
      fail(`Heads up: ${msgs.join(', ')}. Tap the button again to save anyway.`);
      saveBtn.textContent = 'Save anyway';
      err.scrollIntoView({ behavior: 'smooth', block: 'center' }); return;
    }
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

    const loc = document.getElementById('f_location').value.trim();
    const log = {
      ...(ex || {}),
      unitNumber: u.number,
      createdAt: ex?.createdAt || new Date().toISOString(),
      date,
      past,
      location: loc,
      infoComments: document.getElementById('f_infoComments').value.trim(),
      swVersion: document.getElementById('f_swVersion').value.trim(),
      sw: Object.fromEntries(SW_ITEMS.map(([k]) => [k, val('sw.' + k)])),
      swComments: document.getElementById('f_swComments').value.trim(),
      maint: Object.fromEntries(MAINT_ITEMS.map(([k]) => [k, { value: val('maint.' + k), note: (f.querySelector(`input[name="maint.${k}.note"]`)?.value || '').trim() }])),
      maintComments: document.getElementById('f_maintComments').value.trim(),
      tech,
      name,
      signature: sig.isEmpty() ? (ex?.signature || '') : sig.toDataURL(),
    };
    if (ex) { log.updatedAt = new Date().toISOString(); log.updatedBy = name; }
    try {
      await addLog(log);
      // unit location follows the most recent sheet
      const newest = unitLogs(u.number).find(l => l.sw);
      if (loc && newest && newest.id === log.id && loc !== u.location) { u.location = loc; await putUnit(u); }
      else if (loc && !u.location) { u.location = loc; await putUnit(u); }
    } catch (exn) {
      saveBtn.disabled = false; saveBtn.textContent = 'Save';
      return fail('Could not save on this device: ' + (exn && exn.message || exn) + '. Try opening the page in Safari/Chrome (not the camera preview).');
    }
    if (!past) try { localStorage.setItem('colibriTechName', name); } catch (e2) {}
    history.replaceState(null, '', location.pathname);
    openUnit(u.number);
    toast(ex ? 'Sheet updated' : past ? 'Past maintenance logged' : 'Status sheet saved');
  };
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}
// retry uploads when the phone comes back online
window.addEventListener('online', () => load().then(() => { renderDashboard(); }));

function setupSignature() {
  const c = document.getElementById('sigPad'), ctx = c.getContext('2d');
  let drawing = false, empty = true;
  const r0 = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = r0.width * dpr; c.height = r0.height * dpr; ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.onpointerdown = e => { drawing = true; empty = false; c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); };
  c.onpointermove = e => { if (!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); };
  c.onpointerup = c.onpointercancel = () => { drawing = false; };
  document.getElementById('sigClear').onclick = () => { ctx.clearRect(0, 0, c.width, c.height); empty = true; };
  return {
    isEmpty: () => empty,
    toDataURL: () => {
      const o = document.createElement('canvas'); o.width = c.width / 2; o.height = c.height / 2;
      const x = o.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, o.width, o.height); x.drawImage(c, 0, 0, o.width, o.height);
      return o.toDataURL('image/png');
    }
  };
}

/* ---------- add unit ---------- */
document.getElementById('addForm').onsubmit = async e => {
  e.preventDefault();
  const number = document.getElementById('newNumber').value.trim();
  if (!number) return;
  const existing = state.units.find(u => u.number.toLowerCase() === number.toLowerCase());
  if (existing) { openUnit(existing.number); return; }
  const u = { id: number, number, location: document.getElementById('newLocation').value.trim(), comments: document.getElementById('newComments').value.trim(), createdAt: new Date().toISOString() };
  await putUnit(u); state.units.push(u); e.target.reset();
  openUnit(number);
};

/* ---------- start ---------- */
(async () => {
  try { await Promise.race([openDB(), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 3000))]); } catch (e) { idb = null; console.warn('IndexedDB unavailable, using localStorage', e); }
  await load();
  if (!state.units.length) { const u = { id: 'Colibri 19', number: 'Colibri 19', location: '', comments: '', createdAt: new Date().toISOString() }; await putUnit(u); state.units.push(u); }
  renderDashboard();
  const n = new URLSearchParams(location.hash.slice(1)).get('unit');
  if (n) openUnit(n);
  window.addEventListener('hashchange', () => { const m = new URLSearchParams(location.hash.slice(1)).get('unit'); if (m) openUnit(m); });
})();
</script>
