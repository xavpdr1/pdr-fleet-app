<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Colibri Deployment Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: road-case manifest — header with progress + QR tag, box filter chips, one stenciled section per case */
:root{
  --bg:#F2F4F8; --surface:#ffffff; --line:#d9dfe5; --fg:#1A2332; --muted:#5b6876;
  --accent:#2E75B6; --accent-soft:#D9E1F2; --ok:#2b8a3e; --ok-soft:#e6f4ea; --na:#7a8794; --na-soft:#eceff2;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171c; --surface:#1a2128; --line:#2c3640; --fg:#e7ecf1; --muted:#97a4b1;
  --accent:#6FA8DC; --accent-soft:#1c2c3d; --ok:#5cc777; --ok-soft:#183223; --na:#8d99a5; --na-soft:#232b33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --surface:#1a2128; --line:#2c3640; --fg:#e7ecf1; --muted:#97a4b1;
  --accent:#6FA8DC; --accent-soft:#1c2c3d; --ok:#5cc777; --ok-soft:#183223; --na:#8d99a5; --na-soft:#232b33; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:20px}
header.top{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:6px}
.logo{background:#fff;border-radius:6px;padding:8px 12px;display:inline-flex;border:1px solid var(--line)}
.logo img{height:44px;width:auto;display:block}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-size:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,7vw,48px);line-height:1;margin:4px 0 10px;text-wrap:balance;text-transform:uppercase}
.sub{color:var(--muted);margin:0;max-width:52ch}
.qr{background:#fff;border:2px solid var(--fg);border-radius:6px;padding:4px 4px 8px;width:196px;display:grid;gap:2px;justify-items:center}
.qr img{width:184px;height:184px;display:block;image-rendering:pixelated}
.qr span{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#17202a}
.progress{display:grid;gap:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .c{background:var(--ok)} .bar .n{background:var(--na)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:4px}
.btn{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:6px;cursor:pointer}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,.row button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);padding:10px 12px;border-radius:6px}
.notice{font-size:13px;color:var(--muted)}
section.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
section.box h2{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 14px;border-bottom:2px solid var(--fg);font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
section.box h2 span{font-family:var(--f-mono);font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.tick{width:30px;height:30px;border-radius:6px;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--surface)}
.tick svg{width:18px;height:18px;opacity:0}
.row.checked .tick{background:var(--ok);border-color:var(--ok)} .row.checked .tick svg{opacity:1}
.row.na .tick{border-style:dashed;border-color:var(--na)}
.name{min-width:0;display:grid;gap:2px}
.name .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.qty{font-family:var(--f-mono);font-size:13px;color:var(--accent);min-width:2.2em;font-variant-numeric:tabular-nums}
.row.checked .label{color:var(--muted)}
.row.na .label{color:var(--na);text-decoration:line-through}
.meta{font-size:12px;color:var(--muted);padding-left:calc(2.2em + 8px)}
.note{font:13px/1.4 var(--f-body);color:var(--fg);background:transparent;border:1px dashed var(--line);border-radius:6px;padding:5px 8px;margin:4px 0 0 calc(2.2em + 8px);width:calc(100% - 2.2em - 8px);resize:none;overflow:hidden;min-height:30px}
.note::placeholder{color:var(--muted);opacity:.8}
.note:focus{outline:2px solid var(--accent);outline-offset:1px;border-style:solid}
.note.has{border-style:solid;background:var(--accent-soft)}
.noteMeta{font-size:11px;color:var(--muted);padding-left:calc(2.2em + 8px)}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.naBtn{font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 8px;border-radius:4px;cursor:pointer}
.row.na .naBtn{background:var(--na-soft);color:var(--fg);border-color:var(--na)}
.empty{padding:16px 14px;color:var(--muted)}
@media (max-width:520px){header.top{grid-template-columns:1fr}.qr{justify-self:start}}
@media (prefers-reduced-motion:no-preference){.tick{transition:background .12s,border-color .12s}}
*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.who input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);min-width:0;width:12em}
</style>

async function sb(path, opts={}){
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),8000);
  try{ const r=await fetch(`${SB_URL}/rest/v1/${path}`,{...opts,signal:ctl.signal,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',...(opts.headers||{})}});
    if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,120)); const x=await r.text(); return x?JSON.parse(x):null; } finally{ clearTimeout(tm); }
}
const upsert=rows=>sb('fleet_records?on_conflict=kind,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
try { filter = localStorage.getItem("colibri.filter") || "all"; openOnly = localStorage.getItem("colibri.open") === "1"; } catch(e) {}
const $ = id => document.getElementById(id);
try { $("who").value = localStorage.getItem("colibri.who") || ""; } catch(e) {}
$("who").addEventListener("change", ()=>{ try{ localStorage.setItem("colibri.who", $("who").value.trim()); }catch(e){} });
function statusOf(k){ return (state[k] && state[k].status) || "open"; }
function fmt(iso){ try { const d=new Date(iso); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); } catch(e){ return ""; } }
function render(){
  const c = ITEMS.filter(i=>statusOf(i.k)==="checked").length;
  const n = ITEMS.filter(i=>statusOf(i.k)==="na").length;
  const o = ITEMS.length-c-n;
  $("barC").style.width = (c/ITEMS.length*100)+"%";
  $("barN").style.width = (n/ITEMS.length*100)+"%";
  $("stats").innerHTML = `<span><b>${c}</b> packed</span><span><b>${n}</b> N/A</span><span><b>${o}</b> still open</span><span><b>${ITEMS.length}</b> line items</span>`;

  const chips = [["all","All"]].concat(BOXES).map(([k,l])=>{
    const set = k==="all"?ITEMS:ITEMS.filter(i=>i.b===k);
    const open = set.filter(i=>statusOf(i.k)==="open").length;
    return `<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}<small>${open?open+" open":"✓"}</small></button>`;
  }).join("");
  $("chips").innerHTML = chips;
  $("openOnly").setAttribute("aria-pressed", openOnly); $("openOnly").textContent = openOnly ? "Show all items" : "Show open only";

  const html = BOXES.filter(([k])=>filter==="all"||filter===k).map(([k,l])=>{
    const all = ITEMS.filter(i=>i.b===k);
    const list = all.filter(i=>!openOnly||statusOf(i.k)==="open");
    const done = all.filter(i=>statusOf(i.k)!=="open").length;
    const rows = list.map(i=>{
      const s = statusOf(i.k), st = state[i.k];
      let meta = "";
      if (st && s!=="open" && st.at){ const who = st.by || ""; meta = `<div class="meta">${s==="na"?"Marked N/A":"Packed"}${who?" by "+esc(who):""} · ${fmt(st.at)}</div>`; }
      return `<li class="row ${s}" data-k="${i.k}">
        <button class="tick" data-act="tick" aria-label="${s==="checked"?"Uncheck":"Check"} ${esc(i.n)}" aria-pressed="${s==="checked"}" ${canWrite?"":"disabled"}>${CHECK_SVG}</button>
        <div class="name"><div class="t"><span class="qty">×${i.q}</span><span class="label">${esc(i.n)}</span>${i.note?`<span class="tag">${esc(i.note)}</span>`:""}</div>${meta}<textarea class="note${st&&st.note?" has":""}" id="note-${i.k}" data-k="${i.k}" rows="1" placeholder="Add a note…" aria-label="Note for ${esc(i.n)}" ${canWrite?"":"disabled"}>${esc(st&&st.note||"")}</textarea>${st&&st.note&&st.noteAt?`<div class="noteMeta">Note${st.noteBy?" by "+esc(st.noteBy):""} · ${fmt(st.noteAt)}</div>`:""}</div>
        <button class="naBtn" data-act="na" aria-pressed="${s==="na"}" ${canWrite?"":"disabled"}>N/A</button></li>`;
    }).join("");
    return `<section class="box"><h2>${l}<span>${done}/${all.length}</span></h2><ul>${rows||'<li class="empty">Everything in this case is packed.</li>'}</ul></section>`;
  }).join("");
  $("boxes").innerHTML = html;
  growAll();
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

let pending=0;
async function setStatus(k, status){
  const prev = state[k];
  const body = { ...(prev||{}), status, at: new Date().toISOString(), by: ($("who").value||"").trim() };
  state[k] = body; render(); pending++;
  try { await upsert([{kind:KIND,id:k,data:body,deleted:false,updated_at:body.at}]); $("notice").textContent="Saved. Everyone sees the same list."; }
  catch(e){ state[k]=prev; render(); $("notice").textContent="That change didn't save. Check your signal and tap it again."; }
  finally { pending--; }
}
$("boxes").addEventListener("click", e=>{
  const b = e.target.closest("button[data-act]"); if(!b||!canWrite) return;
  const k = b.closest(".row").dataset.k, s = statusOf(k);
  if (b.dataset.act==="tick") setStatus(k, s==="checked"?"open":"checked");
  else setStatus(k, s==="na"?"open":"na");
});
$("chips").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; filter=b.dataset.f; try{localStorage.setItem("colibri.filter",filter)}catch(_){} render(); });
$("openOnly").addEventListener("click", ()=>{ openOnly=!openOnly; try{localStorage.setItem("colibri.open",openOnly?"1":"0")}catch(_){} render(); });
$("resetBtn").addEventListener("click", ()=>{ $("confirm").hidden=false; });
$("resetNo").addEventListener("click", ()=>{ $("confirm").hidden=true; });
$("resetYes").addEventListener("click", async ()=>{
  $("confirm").hidden=true;
  const at=new Date().toISOString(), by=($("who").value||"").trim();
  const prev=state; state={}; render(); $("notice").textContent="Clearing list…";
  try { await upsert(ITEMS.map(i=>({kind:KIND,id:i.k,data:{...(prev[i.k]||{}),status:"open",at,by},deleted:false,updated_at:at}))); $("notice").textContent="List cleared. Ready for the next deployment."; }
  catch(e){ state=prev; render(); $("notice").textContent="Couldn't clear the list. Check your signal and try again."; }
});
render();

function grow(el){ el.style.height="auto"; el.style.height=el.scrollHeight+"px"; }
function growAll(){ document.querySelectorAll(".note").forEach(grow); }
$("boxes").addEventListener("input", e=>{ if(e.target.classList.contains("note")) grow(e.target); });
$("boxes").addEventListener("change", async e=>{
  const el=e.target; if(!el.classList.contains("note")||!canWrite) return;
  const k=el.dataset.k, prev=state[k], note=el.value.trim();
  if ((prev&&prev.note||"")===note) return;
  const now=new Date().toISOString();
  const body={ status:"open", ...(prev||{}), note, noteBy:($("who").value||"").trim(), noteAt:now };
  if(!note){ delete body.noteBy; delete body.noteAt; }
  state[k]=body; pending++;
  try { await upsert([{kind:KIND,id:k,data:body,deleted:false,updated_at:now}]); $("notice").textContent="Note saved."; }
  catch(err){ state[k]=prev; $("notice").textContent="That note didn't save. Check your signal and try again."; }
  finally { pending--; if(!editing()) render(); }
});
function editing(){ const a=document.activeElement; return a && a.classList && a.classList.contains("note"); }
async function load(){
  if (pending || editing()) return;
  try { const rows = await sb('fleet_records?select=id,data&kind=eq.'+KIND+'&deleted=eq.false');
    if (pending || editing()) return; const next={}; rows.forEach(r=>{ if(r.data) next[r.id]=r.data; }); state=next; render();
    if (/Connecting|Offline/.test($("notice").textContent)) $("notice").textContent="Live: ticks sync to every phone. Refreshes every 10 seconds.";
  } catch(e){ $("notice").textContent="Offline: can't reach the shared list. It will retry automatically."; }
}
load(); setInterval(()=>{ if(!document.hidden) load(); },10000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
</script>
</body></html>
