<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Colibri Deployment Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: road-case manifest — header with progress + QR tag, box filter chips, one stenciled section per case */
:root{
  --bg:#F2F4F8; --surface:#ffffff; --line:#d9dfe5; --fg:#1A2332; --muted:#5b6876;
  --accent:#2E75B6; --accent-soft:#D9E1F2; --ok:#2b8a3e; --ok-soft:#e6f4ea; --na:#7a8794; --na-soft:#eceff2;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171c; --surface:#1a2128; --line:#2c3640; --fg:#e7ecf1; --muted:#97a4b1;
  --accent:#6FA8DC; --accent-soft:#1c2c3d; --ok:#5cc777; --ok-soft:#183223; --na:#8d99a5; --na-soft:#232b33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --surface:#1a2128; --line:#2c3640; --fg:#e7ecf1; --muted:#97a4b1;
  --accent:#6FA8DC; --accent-soft:#1c2c3d; --ok:#5cc777; --ok-soft:#183223; --na:#8d99a5; --na-soft:#232b33; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:20px}
header.top{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:6px}
.logo{background:#fff;border-radius:6px;padding:8px 12px;display:inline-flex;border:1px solid var(--line)}
.logo img{height:44px;width:auto;display:block}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-size:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,7vw,48px);line-height:1;margin:4px 0 10px;text-wrap:balance;text-transform:uppercase}
.sub{color:var(--muted);margin:0;max-width:52ch}
.qr{background:#fff;border:2px solid var(--fg);border-radius:6px;padding:4px 4px 8px;width:196px;display:grid;gap:2px;justify-items:center}
.qr img{width:184px;height:184px;display:block;image-rendering:pixelated}
.qr span{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#17202a}
.progress{display:grid;gap:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .c{background:var(--ok)} .bar .n{background:var(--na)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:4px}
.btn{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:6px;cursor:pointer}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,.row button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);padding:10px 12px;border-radius:6px}
.notice{font-size:13px;color:var(--muted)}
section.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
section.box h2{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 14px;border-bottom:2px solid var(--fg);font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
section.box h2 span{font-family:var(--f-mono);font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.tick{width:30px;height:30px;border-radius:6px;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--surface)}
.tick svg{width:18px;height:18px;opacity:0}
.row.checked .tick{background:var(--ok);border-color:var(--ok)} .row.checked .tick svg{opacity:1}
.row.na .tick{border-style:dashed;border-color:var(--na)}
.name{min-width:0;display:grid;gap:2px}
.name .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.qty{font-family:var(--f-mono);font-size:13px;color:var(--accent);min-width:2.2em;font-variant-numeric:tabular-nums}
.row.checked .label{color:var(--muted)}
.row.na .label{color:var(--na);text-decoration:line-through}
.meta{font-size:12px;color:var(--muted);padding-left:calc(2.2em + 8px)}
.note{font:13px/1.4 var(--f-body);color:var(--fg);background:transparent;border:1px dashed var(--line);border-radius:6px;padding:5px 8px;margin:4px 0 0 calc(2.2em + 8px);width:calc(100% - 2.2em - 8px);resize:none;overflow:hidden;min-height:30px}
.note::placeholder{color:var(--muted);opacity:.8}
.note:focus{outline:2px solid var(--accent);outline-offset:1px;border-style:solid}
.note.has{border-style:solid;background:var(--accent-soft)}
.noteMeta{font-size:11px;color:var(--muted);padding-left:calc(2.2em + 8px)}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.naBtn{font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 8px;border-radius:4px;cursor:pointer}
.row.na .naBtn{background:var(--na-soft);color:var(--fg);border-color:var(--na)}
.empty{padding:16px 14px;color:var(--muted)}
@media (max-width:520px){header.top{grid-template-columns:1fr}.qr{justify-self:start}}
@media (prefers-reduced-motion:no-preference){.tick{transition:background .12s,border-color .12s}}
*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
.session{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px}
.session h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field select,.field input{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0;width:100%}
.field select:focus,.field input:focus{outline:2px solid var(--accent);outline-offset:1px}
.sessHead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--na-soft);color:var(--muted)}
.pill.saved{background:var(--ok-soft);color:var(--ok)} .pill.dirty{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.sendBox{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.sendBox textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%;resize:vertical}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
a.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.inl{display:flex;gap:8px;flex-wrap:wrap}.inl input{flex:1 1 160px;width:auto}
</style>
</head><body>

        <div class="field"><label for="sendTo">Send to</label><select id="sendTo"></select></div>

      <div class="notice" id="sendNote"></div>
    </div>
    <div class="confirm" id="confirm" hidden>
      <span>Start a new, blank checklist? This one stays saved under Viewing.</span>
      <button class="btn primary" id="newYes">Start new</button>
      <button class="btn" id="newNo">Cancel</button>
    </div>
  </section>

  <div class="tools">
    <div class="chips" id="chips" role="toolbar" aria-label="Filter by case"></div>
    <button class="btn" id="openOnly" aria-pressed="false">Show open only</button>
  </div>
  <div class="notice" id="notice">Connecting to the shared list…</div>

  <div id="boxes" style="display:grid;gap:16px"></div>
</div>

  const body={ status:"open", ...(prev||{}), note, noteBy:me(), noteAt:now };
  if(!note){ delete body.noteBy; delete body.noteAt; }
  state[k]=body; pending++;
  try { await putCheck(k, body); $("notice").textContent="Note saved."; }
  catch(err){ state[k]=prev; $("notice").textContent="That note didn't save. Check your signal and try again."; }
  finally { pending--; renderSession(); if(!editing()) render(); }
});

/* ---------- sync ---------- */
function editing(){ const a=document.activeElement; return !!a && ((a.classList && a.classList.contains("note")) || ["checker","ckdate","newName","deptype","depSel","sendTo","sendMsg"].includes(a.id)); }
let loading=false, again=false;
async function load(force){
  if (loading){ if(force) again=true; return; }
  if (!force && (pending || editing())) return;
  loading=true;
  try {
    const rows = await sb('fleet_records?select=kind,id,data&kind=in.('+DEP+','+META+',person)&deleted=eq.false');
    const nextDeps=[], nextTeam=[]; rows.forEach(r=>{ if(!r.data) return; if(r.kind===META && r.id==='people' && Array.isArray(r.data.names)) people=r.data.names; if(r.kind===DEP) nextDeps.push({id:r.id,data:r.data}); if(r.kind==='person' && r.data.name) nextTeam.push({name:r.data.name,phone:r.data.phone||'',email:r.data.email||'',role:r.data.role||''}); }); team=nextTeam.sort((a,b)=>a.name.localeCompare(b.name));
    nextDeps.sort((a,b)=>String(b.data.createdAt||"").localeCompare(String(a.data.createdAt||"")));
    if (!nextDeps.length){ const at=nowIso(); const d={id:"d"+Date.now().toString(36),data:{type:"Deployment",by:"",date:today(),createdAt:at,updatedAt:at}}; await upsert([{kind:DEP,id:d.id,data:d.data,deleted:false,updated_at:at}]); nextDeps.push(d); }
    if (viewId && !nextDeps.some(d=>d.id===viewId)) viewId=null;
    const d = nextDeps.find(x=>x.id===viewId) || nextDeps[0];
    const checks = await sb('fleet_records?select=id,data&kind=eq.'+KIND+'&deleted=eq.false&id=like.'+encodeURIComponent(d.id+':')+'*');
    if (!force && (pending || editing())) return;
    deps=nextDeps; const next={}; checks.forEach(r=>{ if(r.data) next[r.id.slice(d.id.length+1)]=r.data; }); state=next;
    ready=true; renderSession(); render();
    if (/Connecting|Offline|Loading/.test($("notice").textContent)) $("notice").textContent = viewId ? "Viewing an earlier deployment. Choose the latest under Viewing to go back." : "Live: ticks sync to every phone. Refreshes every 10 seconds.";
  } catch(e){ $("notice").textContent="Offline: can't reach the shared list. It will retry automatically."; }
  finally { loading=false; if(again){ again=false; load(true); } }
}
render(); renderSession();
load(); setInterval(()=>{ if(!document.hidden) load(); },10000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
</script>
