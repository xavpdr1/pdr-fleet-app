<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Shop Requests · PDR-Team</title>
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: inbox list of customer requests, newest first; each card shows contact, place, photos and a status switch */
:root{--bg:#F2F4F8;--surface:#fff;--line:#d9dfe5;--fg:#1A2332;--muted:#5b6876;--accent:#2E75B6;--ok:#2b8a3e;--ok-soft:#e6f4ea;--new:#b26a00;--new-soft:#fff3df;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--surface:#1a2128;--line:#2c3640;--fg:#e7ecf1;--muted:#97a4b1;--accent:#6FA8DC;--ok:#5cc777;--ok-soft:#183223;--new:#f0b35a;--new-soft:#3a2c14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171c;--surface:#1a2128;--line:#2c3640;--fg:#e7ecf1;--muted:#97a4b1;--accent:#6FA8DC;--ok:#5cc777;--ok-soft:#183223;--new:#f0b35a;--new-soft:#3a2c14;color-scheme:dark}
*{box-sizing:border-box} html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body)}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
h1{font:700 clamp(28px,7vw,40px)/1 var(--f-display);text-transform:uppercase;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;min-width:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.top h2{margin:0;font:700 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:0;cursor:pointer}
.pill.new{background:var(--new-soft);color:var(--new)} .pill.contacted{background:var(--ok-soft);color:var(--ok)}
.meta{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.meta b{color:var(--fg);font-weight:600}
.meta a{color:var(--accent)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:110px;height:110px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.empty{padding:16px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
dialog{border:0;padding:0;background:transparent;max-width:96vw}
dialog img{max-width:96vw;max-height:88vh;border-radius:8px;display:block}
dialog::backdrop{background:rgba(0,0,0,.75)}
</style></head><body>
<div class="wrap">
  <header><h1>Shop requests</h1><p class="sub" id="sub">Customers who used “See the Colibri at your shop”. Newest first.</p></header>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<dialog id="dlg"><img id="big" alt="Shop photo, full size"></dialog>
<script>
const SB_URL='https://jedolnkjmlrruipkgqyd.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZG9sbmtqbWxycnVpcGtncXlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3ODk1ODQsImV4cCI6MjEwNjM2NTU4NH0.h3W7vimHuA_KPGmOjGN8HhM24k9apRta44l9D8xtF-Y';
const H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when=t=>new Date(t).toLocaleString([], {month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
let leads=[];
async function load(){
  const r=await fetch(`${SB_URL}/rest/v1/fleet_records?kind=eq.shop_lead&deleted=eq.false&select=id,data&order=data->>at.desc`,{headers:H});
  leads=await r.json(); render();
  for(const l of leads){ if(!l.data.photos) continue;
    const ir=await fetch(`${SB_URL}/rest/v1/fleet_records?kind=eq.shop_lead_img&id=like.${encodeURIComponent(l.id)}%7C*&select=data`,{headers:H});
    const imgs=(await ir.json()).sort((a,b)=>a.data.i-b.data.i);
    const el=document.querySelector(`[data-thumbs="${l.id}"]`); if(el) el.innerHTML=imgs.map(x=>`<img src="${x.data.img}" alt="Shop photo">`).join("");
  }
}
function render(){
  document.getElementById("sub").textContent=`${leads.length} request${leads.length===1?"":"s"}. Newest first. Tap the status to mark contacted.`;
  document.getElementById("list").innerHTML=leads.length?leads.map(l=>{ const d=l.data, st=d.status==="contacted"?"contacted":"new";
    const map=d.place?`https://www.google.com/maps/search/?api=1&query=${d.place.lat},${d.place.lng}`:(d.address?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.address)}`:"");
    return `<article class="card"><div class="top"><h2>${esc(d.shop)}</h2><button class="pill ${st}" data-id="${esc(l.id)}">${st==="new"?"New":"Contacted"}</button></div>
      <div class="meta"><b>${esc(d.name)}</b> · ${esc(d.email)}${d.phone?" · "+esc(d.phone):""} · ${esc(when(d.at))}</div>
      <div class="meta">${esc(d.address||"No address entered")}${map?` · <a href="${map}" target="_blank" rel="noopener">Map</a>`:""} · Interested in: <b>${esc(d.model||"")}</b></div>
      ${d.notes?`<div class="meta">Notes: ${esc(d.notes)}</div>`:""}
      ${d.photos?`<div class="thumbs" data-thumbs="${esc(l.id)}">Loading ${d.photos} photo${d.photos>1?"s":""}…</div>`:`<div class="meta">No photos.</div>`}
    </article>`; }).join(""):'<div class="empty">No requests yet. They appear here when a customer sends the form on the shop page.</div>';
}
document.addEventListener("click",async e=>{
  const img=e.target.closest(".thumbs img"); if(img){ document.getElementById("big").src=img.src; document.getElementById("dlg").showModal(); return; }
  if(e.target.id==="dlg"){ e.target.close(); return; }
  const b=e.target.closest(".pill"); if(!b) return;
  const l=leads.find(x=>x.id===b.dataset.id); if(!l) return;
  l.data.status=l.data.status==="contacted"?"new":"contacted"; render();
  await fetch(`${SB_URL}/rest/v1/fleet_records?on_conflict=kind,id`,{method:"POST",headers:{...H,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify([{kind:"shop_lead",id:l.id,data:l.data,deleted:false,updated_at:new Date().toISOString()}])});
  load();
});
document.getElementById("dlg").addEventListener("click",e=>{ if(e.target.tagName!=="IMG") e.currentTarget.close(); });
load().catch(()=>{ document.getElementById("list").innerHTML='<div class="empty">Couldn\'t load requests. Check the connection and refresh.</div>'; });
</script>
</body></html>
