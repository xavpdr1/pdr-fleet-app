<style>
/* Layout: one-thumb remote — unit/PIN strip, vehicle form with photo buttons, big full-width start button pinned at the bottom */
:root{--bg:#F2F4F8;--surface:#fff;--line:#d9dfe5;--fg:#1A2332;--muted:#5b6876;--accent:#2E75B6;--accent-soft:#D9E1F2;--ok:#2b8a3e;--bad:#c62828;--warn:#b26a00;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--surface:#1a2128;--line:#2c3640;--fg:#e7ecf1;--muted:#97a4b1;--accent:#6FA8DC;--accent-soft:#1c2c3d;--ok:#5cc777;--bad:#ff6b6b;--warn:#f0b35a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171c;--surface:#1a2128;--line:#2c3640;--fg:#e7ecf1;--muted:#97a4b1;--accent:#6FA8DC;--accent-soft:#1c2c3d;--ok:#5cc777;--bad:#ff6b6b;--warn:#f0b35a;color-scheme:dark}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 150px;display:grid;gap:14px}
h1{font:700 32px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top a{font-size:14px;color:var(--accent)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
label{display:grid;gap:4px;font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:0}
select,input{font:500 17px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input.code{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
#pin{letter-spacing:.3em}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ready{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.ready.on .dot{background:var(--ok)} .ready.off .dot{background:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px}
.withcam{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.cam{font:600 14px var(--f-body);border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:0 12px;height:46px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.cam svg{width:18px;height:18px}
.cam:disabled{opacity:.5}
.hint{font-size:13px;color:var(--muted);margin-top:-6px;min-height:1em}
.hint.ok{color:var(--ok)} .hint.warn{color:var(--warn)} .hint.bad{color:var(--bad)}
.clear{justify-self:start;font:500 14px var(--f-body);background:none;border:0;color:var(--accent);padding:0;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px max(14px,env(safe-area-inset-bottom))}
.bar .in{max-width:460px;margin:0 auto;display:grid;gap:8px}
.btns{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.btns.solo{grid-template-columns:1fr}
.stop{height:72px;border-radius:14px;border:2px solid var(--bad);background:var(--surface);color:var(--bad);font:700 22px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.stop:disabled{opacity:.5}
.go{width:100%;height:72px;border-radius:14px;border:0;background:var(--accent);color:#fff;font:700 30px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15);transition:transform .08s}
.go:active{transform:scale(.98)} .go:disabled{opacity:.6}
.go.ok{background:var(--ok)} .go.bad{background:var(--bad)}
.msg{text-align:center;font-size:15px;min-height:1.4em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.cv{position:fixed;inset:0;background:#000;z-index:50;display:grid}
.cv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv .shade{position:absolute;inset:0;pointer-events:none}
.cv .guide{position:absolute;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);transition:border-color .15s}
.cv .guide.hit{border-color:#5cc777}
.cv .cvtop{position:absolute;left:0;right:0;top:0;padding:max(14px,env(safe-area-inset-top)) 16px 10px;color:#fff;text-align:center;font:600 17px var(--f-body);text-shadow:0 1px 3px #000}
.cv .cvread{position:absolute;left:16px;right:16px;color:#fff;text-align:center;font:500 22px var(--f-mono);letter-spacing:.08em;text-shadow:0 1px 3px #000;min-height:1.3em}
.cv .cvbtns{position:absolute;left:0;right:0;bottom:0;padding:12px 16px max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.cv .cvbtns button{height:56px;border-radius:12px;border:0;font:600 16px var(--f-body);cursor:pointer}
.cv .cvbtns .snap{background:#fff;color:#111;font:700 20px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.cv .cvbtns .sec{background:rgba(255,255,255,.18);color:#fff}
.hidden{display:none!important}
</style></head><body>
<div class="wrap">
  <div class="top"><h1>Scan Remote</h1><a href="/colibri-status.html">Unit status</a></div>
  <div class="row">
    <label>Unit<select id="unit"><option value="">Loading…</option></select></label>
    <label>PIN<input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="••••"></label>
  </div>
  <div class="ready" id="ready"><span class="dot"></span><span id="readyTxt">Checking the unit…</span></div>

  <div class="card">
    <div class="withcam">
      <label>License plate<input id="plate" class="code" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
      <button class="cam" type="button" data-for="plate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo</button>
    </div>

      <button class="cam" type="button" data-for="vin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo</button>
    </div>
    <div class="hint" id="vinHint"></div>
    <label>Claim No.<input id="claim" maxlength="40" autocomplete="off"></label>
    <div class="two">
      <label>Car brand<input id="brand" maxlength="40" autocomplete="off"></label>
      <label>Car model<input id="model" maxlength="40" autocomplete="off"></label>
    </div>
    <button class="clear" id="clear" type="button">Clear form</button>
  </div>
  <input type="file" id="file" accept="image/*" capture="environment" class="hidden">
</div>
<div class="cv hidden" id="cv">
  <video id="video" playsinline muted autoplay></video>
  <div class="guide" id="guide"></div>
  <div class="cvtop" id="cvTitle">Line up the plate inside the box</div>
  <div class="cvread" id="cvRead"></div>
  <div class="cvbtns"><button class="sec" id="cvCancel" type="button">Cancel</button><button class="snap" id="cvSnap" type="button">Capture</button><button class="sec" id="cvFile" type="button">Use photo</button></div>
</div>
<div class="bar"><div class="in">
  <div class="msg" id="msg">Fill in what you have, then press Start.</div>
  <div class="btns solo" id="btns"><button class="go" id="go" type="button">Start scan</button><button class="stop hidden" id="stop" type="button">Cancel scan</button></div>
</div></div>

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function say(t,cls){const m=$('msg');m.textContent=t;m.className='msg'+(cls?' '+cls:'');}
function hint(id,t,cls){const h=$(id+'Hint');h.textContent=t||'';h.className='hint'+(cls?' '+cls:'');}
function flash(cls){const g=$('go');g.classList.remove('ok','bad');if(cls){g.classList.add(cls);setTimeout(()=>g.classList.remove(cls),2500);}}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]'))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);});}

/* ---------- VIN helpers ---------- */
const VIN_MAP={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};
const VIN_W=[8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
function vinCheckOk(v){if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(v))return false;let s=0;for(let i=0;i<17;i++){const c=v[i];s+=(/\d/.test(c)?+c:VIN_MAP[c])*VIN_W[i];}const r=s%11;return v[8]===(r===10?'X':String(r));}
function vinFromText(t,ocr){
  let u=String(t||'').toUpperCase();
  const cands=[];
  const scan=str=>{for(let i=0;i+17<=str.length;i++){const w=str.slice(i,i+17);if(/^[A-HJ-NPR-Z0-9]{17}$/.test(w))cands.push(w);}};
  for(const tok of u.split(/[^A-Z0-9]+/)){let x=tok;if(x.length===18&&x[0]==='I')x=x.slice(1);if(ocr)x=x.replace(/O|Q/g,'0').replace(/I/g,'1');scan(x);}
  if(ocr){scan(u.replace(/[^A-Z0-9]/g,'').replace(/O|Q/g,'0').replace(/I/g,'1'));}
  const ok=cands.find(vinCheckOk);if(ok)return ok;
  if(ocr){const SW={'8':'B','B':'8','5':'S','S':'5','2':'Z','Z':'2','6':'G','G':'6','0':'D','D':'0','1':'L','L':'1'};
    for(const c of cands){const fixes=[];for(let i=0;i<17;i++){const r=SW[c[i]];if(r){const v=c.slice(0,i)+r+c.slice(i+1);if(vinCheckOk(v))fixes.push(v);}}if(fixes.length===1)return fixes[0];}}
  return cands[0]||'';
}

/* ---------- image helpers ---------- */
function fileToCanvas(file,max=1800){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c);};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'));};img.src=url;});}
function grayCopy(src){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const x=c.getContext('2d');x.drawImage(src,0,0);const d=x.getImageData(0,0,c.width,c.height),p=d.data;let lo=255,hi=0;for(let i=0;i<p.length;i+=4){const g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000;p[i]=g;if(g<lo)lo=g;if(g>hi)hi=g;}const k=hi>lo?255/(hi-lo):1;for(let i=0;i<p.length;i+=4){const g=(p[i]-lo)*k;p[i]=p[i+1]=p[i+2]=g;}x.putImageData(d,0,0);return c;}

/* ---------- barcode (VIN) ---------- */
async function readBarcodes(canvas){
  const out=[];
  if('BarcodeDetector' in window){try{const fm=await BarcodeDetector.getSupportedFormats();const want=['code_39','code_128','data_matrix','qr_code','pdf417'].filter(f=>fm.includes(f));if(want.length){const r=await new BarcodeDetector({formats:want}).detect(canvas);r.forEach(b=>out.push(b.rawValue));}}catch(e){}}
  if(!out.length){try{
    await loadScript('https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js');
    const hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.PDF_417]);
    const reader=new ZXing.MultiFormatReader();reader.setHints(hints);
    for(const c of [canvas,grayCopy(canvas)]){try{const lum=new ZXing.HTMLCanvasElementLuminanceSource(c);const r=reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum)));if(r){out.push(r.getText());break;}}catch(e){}}
  }catch(e){}}
  return out;
}

/* ---------- OCR ---------- */
let ocrWorker=null;
async function getOcr(){if(ocrWorker)return ocrWorker;await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');ocrWorker=await Tesseract.createWorker('eng');return ocrWorker;}
function wordsOf(data){if(data.words&&data.words.length)return data.words;const w=[];(data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>(l.words||[]).forEach(x=>w.push(x)))));return w;}
async function ocr(canvas,whitelist,psm){const w=await getOcr();await w.setParameters({tessedit_char_whitelist:whitelist,tessedit_pageseg_mode:String(psm)});const r=await w.recognize(canvas,{},{text:true,blocks:true});return r.data;}

function plateFromOcr(data){
  const words=wordsOf(data).map(w=>({t:String(w.text||'').toUpperCase().replace(/[^A-Z0-9]/g,''),h:(w.bbox?w.bbox.y1-w.bbox.y0:0),y:(w.bbox?(w.bbox.y0+w.bbox.y1)/2:0),x:(w.bbox?w.bbox.x0:0),c:w.confidence||0})).filter(w=>w.t);
  words.sort((a,b)=>a.y-b.y||a.x-b.x);
  const cands=[];
  for(let i=0;i<words.length;i++){let t='',h=0,c=0;for(let j=i;j<Math.min(words.length,i+3);j++){if(j>i&&Math.abs(words[j].y-words[i].y)>words[i].h*0.6)break;t+=words[j].t;h=Math.max(h,words[j].h);c+=words[j].c;if(t.length>=4&&t.length<=8)cands.push({t,h,c:c/(j-i+1)});}}
  cands.forEach(k=>{k.s=k.h*(/\d/.test(k.t)&&/[A-Z]/.test(k.t)?1.6:/\d/.test(k.t)?1.2:0.7)*(k.t.length>=6&&k.t.length<=7?1.25:1)*(0.5+k.c/200);});
  cands.sort((a,b)=>b.s-a.s);
  return cands.length?cands[0].t:'';
}

function otsu(c){const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),p=d.data,h=new Array(256).fill(0);for(let i=0;i<p.length;i+=4)h[p[i]|0]++;const n=p.length/4;let sum=0;for(let i=0;i<256;i++)sum+=i*h[i];let sB=0,wB=0,best=0,th=128;for(let i=0;i<256;i++){wB+=h[i];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=i*h[i];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;th=i;}}for(let i=0;i<p.length;i+=4){const g=p[i]>th?255:0;p[i]=p[i+1]=p[i+2]=g;}x.putImageData(d,0,0);return c;}
function cropBand(src,y0,y1,x0,x1,targetH){const h=Math.max(1,y1-y0),w=Math.max(1,x1-x0),k=targetH/h;const c=document.createElement('canvas');c.width=Math.round(w*k)+40;c.height=targetH+40;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,x0,y0,w,h,20,20,c.width-40,targetH);return c;}
const PLATE_WL='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
async function readPlate(canvas){
  const g=grayCopy(canvas);
  const d1=await ocr(g,PLATE_WL,11);
  const words=wordsOf(d1).filter(w=>w.bbox&&String(w.text||'').replace(/[^A-Za-z0-9]/g,'').length>=2);
  const cands=[];const first=plateFromOcr(d1);if(first)cands.push({t:first,c:20});
  const tall=words.sort((a,b)=>(b.bbox.y1-b.bbox.y0)-(a.bbox.y1-a.bbox.y0))[0];
  if(tall){
    const hh=tall.bbox.y1-tall.bbox.y0;
    const y0=Math.max(0,tall.bbox.y0-hh*0.3),y1=Math.min(g.height,tall.bbox.y1+hh*0.3);
    const x0=Math.max(0,tall.bbox.x0-hh*3),x1=Math.min(g.width,tall.bbox.x1+hh*3);
    for(const th of [48,72]){
      for(const bin of [false,true]){
        let c=cropBand(g,y0,y1,x0,x1,th);if(bin)c=otsu(c);
        const d=await ocr(c,PLATE_WL,7);
        const t=String(d.text||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
        if(t.length>=4&&t.length<=8)cands.push({t,c:(d.confidence||0)+(t.length>=6&&t.length<=7?15:0)+(/\d/.test(t)&&/[A-Z]/.test(t)?10:0)});
      }
    }
  }
  cands.sort((a,b)=>b.c-a.c);
  return cands.length?cands[0].t:'';
}

/* ---------- cloud plate reader (Plate Recognizer via /api/plate) ---------- */
let cloudOff=false;
function toJpeg(src,max=1280){const k=Math.min(1,max/Math.max(src.width,src.height));const c=document.createElement('canvas');c.width=Math.round(src.width*k);c.height=Math.round(src.height*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85);}
async function cloudPlate(canvas){
  if(cloudOff)return null;
  try{
    const r=await fetch('/api/plate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:toJpeg(canvas)})});
    const d=await r.json().catch(()=>({}));
    if(r.status===503||r.status===404||d.error==='token rejected'){cloudOff=true;return null;}
    if(!r.ok||!d.ok)return null;
    return d;
  }catch(e){return null;}
}
function plateNote(d){return 'Read '+d.plate+(d.state?' ('+d.state+')':'')+'. Please check it.'+(d.alternates&&d.alternates.length?' Could also be '+d.alternates.join(', ')+'.':'');}

/* ---------- photo flow ---------- */
let target='';
function pickFile(which){target=which;$('file').value='';$('file').click();}
document.querySelectorAll('.cam').forEach(b=>b.addEventListener('click',()=>openCam(b.dataset.for)));

/* ---------- live camera ---------- */
let cam={stream:null,which:'',running:false,last:'',hits:0,tick:0,busy:false};
function layoutGuide(){
  const W=innerWidth,Hh=innerHeight,g=$('guide');
  const w=Math.min(W*0.88,cam.which==='vin'?560:460), h=cam.which==='vin'?Math.max(70,w/4.2):w/2;
  const top=Math.round(Hh*0.36-h/2);
  Object.assign(g.style,{width:w+'px',height:h+'px',left:Math.round((W-w)/2)+'px',top:top+'px'});
  $('cvRead').style.top=(top+h+16)+'px';
}
function grabGuide(targetH){
  const v=$('video'),vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return null;
  const W=innerWidth,Hh=innerHeight,k=Math.max(W/vw,Hh/vh),ox=(W-vw*k)/2,oy=(Hh-vh*k)/2;
  const r=$('guide').getBoundingClientRect();
  const pad=cam.which==='vin'?0.06:0.04;
  let sx=(r.left-ox)/k,sy=(r.top-oy)/k,sw=r.width/k,sh=r.height/k;
  sx-=sw*pad;sy-=sh*pad;sw*=1+2*pad;sh*=1+2*pad;
  sx=Math.max(0,sx);sy=Math.max(0,sy);sw=Math.min(vw-sx,sw);sh=Math.min(vh-sy,sh);
  const scale=targetH?targetH/sh:1;
  const c=document.createElement('canvas');c.width=Math.round(sw*scale);c.height=Math.round(sh*scale);
  c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);return c;
}
function grabFull(){const v=$('video');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);return c;}
async function openCam(which){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){pickFile(which);return;}
  cam={stream:null,which,running:true,last:'',hits:0,tick:0,busy:false};
  $('cvTitle').textContent=which==='vin'?'Line up the VIN barcode or VIN inside the box':'Line up the license plate inside the box';
  $('cvRead').textContent='Starting camera…';$('guide').classList.remove('hit');
  $('cv').classList.remove('hidden');layoutGuide();
  try{
    cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$('video');v.srcObject=cam.stream;await v.play();
    try{const t=cam.stream.getVideoTracks()[0],cap=t.getCapabilities?t.getCapabilities():{};if(cap.focusMode&&cap.focusMode.includes('continuous'))await t.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(e){}
    $('cvRead').textContent=which==='vin'?'Looking for the VIN…':'Looking for the plate…';
    if(which==='plate')getOcr().catch(()=>{});
    camLoop();
  }catch(e){closeCam();hint(which,'Camera not available ('+(e.name||e.message)+'). Using a photo instead.','warn');pickFile(which);}
}
function closeCam(){cam.running=false;if(cam.stream)cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null;$('video').srcObject=null;$('cv').classList.add('hidden');}
function acceptCam(val,note,cls){
  const which=cam.which;$('guide').classList.add('hit');if(navigator.vibrate)navigator.vibrate(80);
  setTimeout(()=>{closeCam();$(which).value=val;if(which==='vin'){onVin();if(note)hint('vin',note,cls);}else hint('plate',note||('Read '+val+'. Please check it.'),cls||'warn');saveDraft();},250);
}
function stable(t){if(t&&t===cam.last){cam.hits++;}else{cam.last=t;cam.hits=t?1:0;}return cam.hits>=2;}
async function plateFromCrop(c,strong){
  const g=grayCopy(c);const cands=[];
  const d=await ocr(g,PLATE_WL,11);const a=plateFromOcr(d);if(a)cands.push({t:a,c:(d.confidence||0)});
  const tries=strong?[[64,false],[64,true],[96,false],[96,true]]:[[72,false]];
  const words=wordsOf(d).filter(w=>w.bbox&&String(w.text||'').replace(/[^A-Za-z0-9]/g,'').length>=2).sort((x,y)=>(y.bbox.y1-y.bbox.y0)-(x.bbox.y1-x.bbox.y0));
  const tall=words[0];
  const y0=tall?Math.max(0,tall.bbox.y0-(tall.bbox.y1-tall.bbox.y0)*0.3):0,y1=tall?Math.min(g.height,tall.bbox.y1+(tall.bbox.y1-tall.bbox.y0)*0.3):g.height;
  for(const [th,bin] of tries){let k=cropBand(g,y0,y1,0,g.width,th);if(bin)k=otsu(k);const r=await ocr(k,PLATE_WL,7);const t=String(r.text||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(t.length>=4&&t.length<=8)cands.push({t,c:(r.confidence||0)+(t.length>=5&&t.length<=7?15:0)+(/\d/.test(t)&&/[A-Z]/.test(t)?10:0)});}
  cands.sort((x,y)=>y.c-x.c);return cands.length?cands[0].t:'';
}
async function camLoop(){
  while(cam.running){
    if(!cam.busy&&$('video').videoWidth){
      cam.busy=true;cam.tick++;
      try{
        if(cam.which==='vin'){
          const c=grabGuide(0);let v='';
          for(const raw of await readBarcodes(c)){v=vinFromText(raw,false);if(v)break;}
          if(!v){for(const raw of await readBarcodes(grabFull())){v=vinFromText(raw,false);if(v)break;}}
          if(v&&cam.running){$('cvRead').textContent=v;if(vinCheckOk(v)||stable(v)){acceptCam(v);break;}}
          else if(cam.tick%3===0&&cam.running){const d=await ocr(grayCopy(grabGuide(90)),'ABCDEFGHJKLMNPRSTUVWXYZ0123456789',7);const t=vinFromText(d.text,true);if(t&&cam.running){$('cvRead').textContent=t;if(vinCheckOk(t)&&stable(t)){acceptCam(t);break;}}}
        }else{
          if(!cloudOff&&Date.now()-(cam.lastCloud||0)>2500){
            cam.lastCloud=Date.now();const cd=await cloudPlate(grabFull());
            if(cd&&cd.plate&&cam.running){$('cvRead').textContent=cd.plate;acceptCam(cd.plate,plateNote(cd),'warn');break;}
          }
          if(cloudOff){const c=grabGuide(180);const t=await plateFromCrop(c,false);
            if(cam.running){$('cvRead').textContent=t||'Looking for the plate…';if(t&&stable(t)){acceptCam(t);break;}}}
        }
      }catch(e){}
      cam.busy=false;
    }
    await new Promise(r=>setTimeout(r,cam.which==='vin'?250:400));
  }
}
$('cvCancel').addEventListener('click',closeCam);
$('cvFile').addEventListener('click',()=>{const w=cam.which;closeCam();pickFile(w);});
$('cvSnap').addEventListener('click',async()=>{
  if(!cam.running)return;const which=cam.which;$('cvRead').textContent='Reading…';
  while(cam.busy)await new Promise(r=>setTimeout(r,50));cam.busy=true;
  try{
    if(which==='vin'){
      let v='';for(const c of [grabGuide(0),grabFull()]){for(const raw of await readBarcodes(c)){v=vinFromText(raw,false);if(v)break;}if(v)break;}
      if(!v){for(const th of [90,130]){const d=await ocr(grayCopy(grabGuide(th)),'ABCDEFGHJKLMNPRSTUVWXYZ0123456789',7);v=vinFromText(d.text,true);if(v&&vinCheckOk(v))break;}}
      if(v){acceptCam(v,vinCheckOk(v)?'':'Read '+v+', but it may be off by a character. Please check it.','warn');}
      else $('cvRead').textContent='No VIN found. Move closer and hold still.';
    }else{
      const cd=await cloudPlate(grabFull());
      if(cd&&cd.plate){acceptCam(cd.plate,plateNote(cd),'warn');}
      else{const t=await plateFromCrop(grabGuide(180),true);
        if(t)acceptCam(t);else $('cvRead').textContent='No plate found. Fill the box with the plate.';}
    }
  }catch(e){$('cvRead').textContent='Couldn\'t read that. Try again.';}
  cam.busy=false;
});
addEventListener('resize',()=>{if(cam.running)layoutGuide();});
$('file').addEventListener('change',async()=>{
  const f=$('file').files[0];if(!f||!target)return;const which=target;
  const btns=document.querySelectorAll('.cam');btns.forEach(b=>b.disabled=true);
  try{
    const canvas=await fileToCanvas(f);
    if(which==='vin'){
      hint('vin','Looking for the VIN barcode…');
      let v='';for(const raw of await readBarcodes(canvas)){v=vinFromText(raw,false);if(v)break;}
      if(!v){hint('vin','No barcode found. Reading the VIN text… (first time can take ~15 s)');const d=await ocr(grayCopy(canvas),'ABCDEFGHJKLMNPRSTUVWXYZ0123456789',11);v=vinFromText(d.text,true);}
      if(v){$('vin').value=v;onVin();if(!vinCheckOk(v))hint('vin','Read '+v+', but it may be off by a character. Please check it.','warn');}
      else hint('vin','Couldn\'t read a VIN. Try closer, straight on, no glare, or type it.','bad');
    }else{
      hint('plate','Reading the plate…');
      const cd=await cloudPlate(canvas);
      if(cd&&cd.plate){$('plate').value=cd.plate;hint('plate',plateNote(cd),'warn');return;}
      if(!cloudOff&&cd)hint('plate','Reading the plate…');
      const p=await readPlate(canvas);
      if(p){$('plate').value=p;hint('plate','Read '+p+'. Please check it.','warn');}
      else hint('plate','Couldn\'t read the plate. Fill the photo with the plate, straight on, or type it.','bad');
    }
  }catch(e){hint(which,'Couldn\'t process that photo ('+e.message+').','bad');}
  finally{btns.forEach(b=>b.disabled=false);saveDraft();}
});

/* ---------- VIN lookup (NHTSA) ---------- */
let vinTimer=null,lastLookup='';
function titleCase(s){return String(s||'').toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());}
function onVin(){
  const v=$('vin').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if($('vin').value!==v)$('vin').value=v;
  clearTimeout(vinTimer);
  if(v.length<17){hint('vin',v.length?v.length+' of 17 characters':'');return;}
  if(!vinCheckOk(v))hint('vin','That VIN doesn\'t pass the check digit. Please double-check it.','warn');
  vinTimer=setTimeout(()=>lookupVin(v),300);
}
async function lookupVin(v){
  if(v===lastLookup)return;lastLookup=v;
  try{
    const r=await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+v+'?format=json');
    const x=((await r.json()).Results||[])[0]||{};
    if(!x.Make){hint('vin',vinCheckOk(v)?'VIN looks valid, but the lookup found no vehicle.':'VIN not recognized. Please double-check it.','warn');return;}
    const make=titleCase(x.Make),model=x.Model||'';
    if(!$('brand').value||$('brand').value===autoFilled.brand){$('brand').value=make;autoFilled.brand=make;}
    if(!$('model').value||$('model').value===autoFilled.model){$('model').value=model;autoFilled.model=model;}
    hint('vin',[x.ModelYear,make,model,x.Trim].filter(Boolean).join(' '),'ok');saveDraft();
  }catch(e){hint('vin','Couldn\'t look up the VIN right now.','warn');}
}

/* ---------- form state ---------- */
function vals(){const o={};FIELDS.forEach(k=>o[k]=$(k).value.trim());o.plate=o.plate.toUpperCase();o.vin=o.vin.toUpperCase();return o;}
function saveDraft(){store.set('scanDraft',JSON.stringify(vals()));}
function clearForm(){FIELDS.forEach(k=>$(k).value='');autoFilled={brand:'',model:''};lastLookup='';hint('plate','');hint('vin','');saveDraft();}
FIELDS.forEach(k=>$(k).addEventListener('input',()=>{if(k==='vin')onVin();if(k==='plate')$('plate').value=$('plate').value.toUpperCase().replace(/[^A-Z0-9 -]/g,'');saveDraft();}));
$('clear').addEventListener('click',clearForm);

/* ---------- units / ready ---------- */
async function loadUnits(){
  const sel=$('unit');
  try{const r=await fetch(SB_URL+'/rest/v1/colibri_units?select=number&order=number.asc',{headers:H});const list=(await r.json()).map(x=>x.number).filter(Boolean);
    sel.innerHTML='<option value="">Choose…</option>'+list.map(n=>`<option>${n.replace(/</g,'&lt;')}</option>`).join('');
    const last=store.get('scanUnit');if(last&&list.includes(last))sel.value=last;}catch(e){sel.innerHTML='<option value="">Couldn\'t load units</option>';}
  const p=store.get('scanPin');if(p)$('pin').value=p;
  try{const d=JSON.parse(store.get('scanDraft')||'{}');FIELDS.forEach(k=>{if(d[k])$(k).value=d[k];});}catch(e){}
  checkReady();
}
async function checkReady(){
  clearTimeout(readyTimer);const u=$('unit').value,el=$('ready'),t=$('readyTxt');
  if(!u){el.className='ready';t.textContent='Choose a unit.';return;}
  try{const r=await fetch(SB_URL+'/rest/v1/fleet_records?select=data,updated_at&kind=eq.colibri_remote&id=eq.'+encodeURIComponent(u),{headers:H});const rows=await r.json();
    if(!rows.length){setCancel(false);el.className='ready off';t.textContent='Remote not installed on '+u+' yet.';}
    else{const age=(Date.now()-new Date(rows[0].updated_at).getTime())/1000;
      const ver=String((rows[0].data||{}).ver||'0');setCancel(age<90&&verAtLeast(ver,'1.5'));
      if(age<90&&(rows[0].data||{}).note==='locked'){el.className='ready off';t.textContent=u+'\'s PC screen is locked. Unlock it so the remote can press buttons.';}
      else if(age<90){el.className='ready on';t.textContent=u+' is ready. Keep the scan form open on its PC.';}
      else{el.className='ready off';t.textContent=u+' isn\'t answering. It restarts itself within 5 minutes; if not, run its repair file on the PC.';}}
  }catch(e){el.className='ready';t.textContent='No connection.';}
  readyTimer=setTimeout(checkReady,15000);
}

function verAtLeast(v,min){const a=v.split('.').map(Number),b=min.split('.').map(Number);for(let i=0;i<Math.max(a.length,b.length);i++){if((a[i]||0)!==(b[i]||0))return (a[i]||0)>(b[i]||0);}return true;}
function setCancel(on){$('stop').classList.toggle('hidden',!on);$('btns').classList.toggle('solo',!on);}
async function sendCmd(u,pin,cmd,fields){
  const at=new Date().toISOString(),id=u+'|'+at;
  const row={kind:'colibri_cmd',id,deleted:false,updated_at:at,data:{unit:u,cmd,status:'new',at,by:'phone',pin:await sha(pin),fields:fields||null}};
  const r=await fetch(SB_URL+'/rest/v1/fleet_records',{method:'POST',headers:{...H,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)});
  if(!r.ok)throw new Error('send '+r.status);
  const t0=Date.now();
  while(Date.now()-t0<30000){
    await new Promise(res=>setTimeout(res,1000));
    const q=await fetch(SB_URL+'/rest/v1/fleet_records?select=data&kind=eq.colibri_cmd&id=eq.'+encodeURIComponent(id),{headers:H});
    const d=((await q.json())[0]||{}).data||{};
    if(d.status&&d.status!=='new')return d;
  }
  return null;
}
async function cancelScan(){
  if(busy)return;
  const u=$('unit').value,pin=$('pin').value.trim();
  if(!u){say('Choose a unit first.','bad');return;}
  if(!/^\d{4,8}$/.test(pin)){say('Enter the PIN (4 to 8 digits).','bad');return;}
  busy=true;$('go').disabled=true;$('stop').disabled=true;say('Cancelling…');
  if(navigator.vibrate)navigator.vibrate(30);
  try{
    const d=await sendCmd(u,pin,'cancel',null);
    if(!d)say('No answer from '+u+'. Is its main PC on and logged in?','bad');
    else if(d.status==='cancelled')say('Scan cancelled.','ok');
    else if(d.status==='denied')say('Wrong PIN.','bad');
    else say(d.msg||('Didn\'t cancel ('+d.status+').'),'bad');
  }catch(e){say('Couldn\'t send. Check your connection.','bad');}
  finally{busy=false;$('go').disabled=false;$('stop').disabled=false;}
}
$('stop').addEventListener('click',cancelScan);

/* ---------- start ---------- */
async function start(){
  if(busy)return;
  const u=$('unit').value,pin=$('pin').value.trim(),f=vals();
  if(!u){say('Choose a unit first.','bad');return;}
  if(!/^\d{4,8}$/.test(pin)){say('Enter the PIN (4 to 8 digits).','bad');return;}
  const anyField=FIELDS.some(k=>f[k]);
  if(anyField&&!f.plate){say('Add the license plate (it\'s required on the PC).','bad');$('plate').focus();return;}
  store.set('scanUnit',u);store.set('scanPin',pin);
  busy=true;$('go').disabled=true;say(anyField?'Sending details…':'Sending…');
  if(navigator.vibrate)navigator.vibrate(30);
  const at=new Date().toISOString(),id=u+'|'+at;
  try{
    const row={kind:'colibri_cmd',id,deleted:false,updated_at:at,data:{unit:u,cmd:'new_scan',status:'new',at,by:'phone',pin:await sha(pin),fields:anyField?f:null}};
    const r=await fetch(SB_URL+'/rest/v1/fleet_records',{method:'POST',headers:{...H,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)});
    if(!r.ok)throw new Error('send '+r.status);
    say('Waiting for '+u+'…');
    const t0=Date.now();
    while(Date.now()-t0<30000){
      await new Promise(res=>setTimeout(res,1000));
      const q=await fetch(SB_URL+'/rest/v1/fleet_records?select=data&kind=eq.colibri_cmd&id=eq.'+encodeURIComponent(id),{headers:H});
      const d=((await q.json())[0]||{}).data||{};
      if(d.status==='started'){const extra=(d.msg||'').match(/\(not filled.*\)/);say('Scan started ✓'+(extra?' '+extra[0]:''),'ok');flash('ok');if(navigator.vibrate)navigator.vibrate([60,60,60]);if(anyField)clearForm();return;}
      if(d.status==='denied'){say('Wrong PIN.','bad');flash('bad');return;}
      if(d.status&&d.status!=='new'){say(d.msg||('Didn\'t start ('+d.status+').'),'bad');flash('bad');return;}
    }
    say('No answer from '+u+'. Is its main PC on and logged in?','bad');flash('bad');
  }catch(e){say('Couldn\'t send. Check your connection.','bad');flash('bad');}
  finally{busy=false;$('go').disabled=false;checkReady();}
}
$('unit').addEventListener('change',()=>{store.set('scanUnit',$('unit').value);checkReady();});
$('go').addEventListener('click',start);
loadUnits();
</script>
