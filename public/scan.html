<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Scan Remote">
<title>Scan Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-thumb remote — unit + PIN on top, one huge round button in the middle, result line under it */
:root{--bg:#F2F4F8;--surface:#fff;--line:#d9dfe5;--fg:#1A2332;--muted:#5b6876;--accent:#2E75B6;--ok:#2b8a3e;--ok-soft:#e6f4ea;--bad:#c62828;--bad-soft:#fdecea;--warn:#b26a00;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--surface:#1a2128;--line:#2c3640;--fg:#e7ecf1;--muted:#97a4b1;--accent:#6FA8DC;--ok:#5cc777;--ok-soft:#183223;--bad:#ff6b6b;--bad-soft:#3a1c1c;--warn:#f0b35a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171c;--surface:#1a2128;--line:#2c3640;--fg:#e7ecf1;--muted:#97a4b1;--accent:#6FA8DC;--ok:#5cc777;--ok-soft:#183223;--bad:#ff6b6b;--bad-soft:#3a1c1c;--warn:#f0b35a;color-scheme:dark}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
.wrap{max-width:440px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));display:grid;gap:18px;min-height:100vh;min-height:100dvh;grid-template-rows:auto auto 1fr auto}
h1{font:700 34px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px}
label{display:grid;gap:4px;font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
select,input{font:500 18px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input{letter-spacing:.3em}
select:focus-visible,input:focus-visible,.go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ready{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.ready.on .dot{background:var(--ok)} .ready.off .dot{background:var(--bad)}
.center{display:grid;place-items:center;align-content:center;gap:18px}
.go{width:min(72vw,280px);aspect-ratio:1;border-radius:50%;border:0;background:var(--accent);color:#fff;font:700 40px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.18),inset 0 -6px 0 rgba(0,0,0,.15);transition:transform .08s}
.go:active{transform:scale(.96)}
.go:disabled{opacity:.6;cursor:default}
.go.ok{background:var(--ok)} .go.bad{background:var(--bad)}
.msg{min-height:3em;text-align:center;font-size:17px;max-width:32ch}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.foot{font-size:13px;color:var(--muted);text-align:center}
.foot a{color:var(--accent)}
</style></head><body>
<div class="wrap">
  <h1>Scan Remote</h1>
  <div style="display:grid;gap:10px">
    <div class="row">
      <label>Unit<select id="unit"><option value="">Loading…</option></select></label>
      <label>PIN<input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="••••"></label>
    </div>
    <div class="ready" id="ready"><span class="dot"></span><span id="readyTxt">Checking the unit…</span></div>
  </div>
  <div class="center">
    <button class="go" id="go" type="button">Start<br>scan</button>
    <div class="msg" id="msg">Pick the unit, enter the PIN, press the button.</div>
  </div>
  <div class="foot">Presses <b>Automatic Start</b> on the unit's main PC. Fill in the scan form there first. <a href="/colibri-status.html">Unit status</a></div>
</div>
<script>
const SB_URL='https://jedolnkjmlrruipkgqyd.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZG9sbmtqbWxycnVpcGtncXlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3ODk1ODQsImV4cCI6MjEwNjM2NTU4NH0.h3W7vimHuA_KPGmOjGN8HhM24k9apRta44l9D8xtF-Y';
const H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let busy=false, readyTimer=null;

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function say(t,cls){const m=$('msg');m.textContent=t;m.className='msg'+(cls?' '+cls:'');}
function flash(cls){const g=$('go');g.classList.remove('ok','bad');if(cls){g.classList.add(cls);setTimeout(()=>g.classList.remove(cls),2500);}}

async function loadUnits(){
  const sel=$('unit');
  try{
    const r=await fetch(SB_URL+'/rest/v1/colibri_units?select=number&order=number.asc',{headers:H});
    const list=(await r.json()).map(x=>x.number).filter(Boolean);
    sel.innerHTML='<option value="">Choose…</option>'+list.map(n=>`<option>${n.replace(/</g,'&lt;')}</option>`).join('');
    const last=store.get('scanUnit'); if(last&&list.includes(last)) sel.value=last;
  }catch(e){sel.innerHTML='<option value="">Couldn\'t load units</option>';}
  const p=store.get('scanPin'); if(p) $('pin').value=p;
  checkReady();
}

async function checkReady(){
  clearTimeout(readyTimer);
  const u=$('unit').value, el=$('ready'), t=$('readyTxt');
  if(!u){el.className='ready';t.textContent='Choose a unit.';return;}
  try{
    const r=await fetch(SB_URL+'/rest/v1/fleet_records?select=data,updated_at&kind=eq.colibri_remote&id=eq.'+encodeURIComponent(u),{headers:H});
    const rows=await r.json();
    if(!rows.length){el.className='ready off';t.textContent='Remote not installed on '+u+' yet.';}
    else{
      const age=(Date.now()-new Date(rows[0].updated_at).getTime())/1000;
      if(age<90){el.className='ready on';t.textContent=u+' is ready.';}
      else{el.className='ready off';t.textContent=u+' isn\'t answering (main PC off or logged out).';}
    }
  }catch(e){el.className='ready';t.textContent='No connection.';}
  readyTimer=setTimeout(checkReady,15000);
}

async function start(){
  if(busy) return;
  const u=$('unit').value, pin=$('pin').value.trim();
  if(!u){say('Choose a unit first.','bad');return;}
  if(!/^\d{4,8}$/.test(pin)){say('Enter the PIN (4 to 8 digits).','bad');return;}
  store.set('scanUnit',u); store.set('scanPin',pin);
  busy=true; $('go').disabled=true; say('Sending…');
  if(navigator.vibrate) navigator.vibrate(30);
  const at=new Date().toISOString(), id=u+'|'+at;
  try{
    const row={kind:'colibri_cmd',id,deleted:false,updated_at:at,data:{unit:u,cmd:'new_scan',status:'new',at,by:'phone',pin:await sha(pin)}};
    const r=await fetch(SB_URL+'/rest/v1/fleet_records',{method:'POST',headers:{...H,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)});
    if(!r.ok) throw new Error('send '+r.status);
    say('Waiting for '+u+'…');
    const t0=Date.now();
    while(Date.now()-t0<20000){
      await new Promise(res=>setTimeout(res,1000));
      const q=await fetch(SB_URL+'/rest/v1/fleet_records?select=data&kind=eq.colibri_cmd&id=eq.'+encodeURIComponent(id),{headers:H});
      const d=((await q.json())[0]||{}).data||{};
      if(d.status==='started'){say('Scan started ✓','ok');flash('ok');if(navigator.vibrate)navigator.vibrate([60,60,60]);return;}
      if(d.status==='denied'){say('Wrong PIN.','bad');flash('bad');return;}
      if(d.status&&d.status!=='new'){say(d.msg||('Didn\'t start ('+d.status+').'),'bad');flash('bad');return;}
    }
    say('No answer from '+u+'. Is its main PC on and logged in?','bad');flash('bad');
  }catch(e){say('Couldn\'t send. Check your connection.','bad');flash('bad');}
  finally{busy=false;$('go').disabled=false;checkReady();}
}

$('unit').addEventListener('change',()=>{store.set('scanUnit',$('unit').value);checkReady();});
$('go').addEventListener('click',start);
loadUnits();
</script>
</body></html>
