                </div>
                <div class="title-section">
                    <h1>PDR-Team Fleet Tracker</h1>
                    <p>Real-time vehicle tracking with QR codes and Appletag integration</p>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="control-group">
                <button class="active" onclick="app.switchView('all')"><i class="fas fa-th"></i> All Vehicles</button>
                <button onclick="app.switchView('active')"><i class="fas fa-map-marker-alt"></i> Active</button>
                <button onclick="app.switchView('tracked')"><i class="fas fa-signal"></i> Tracked</button>
                <button onclick="app.switchView('qronly')"><i class="fas fa-qrcode"></i> QR Codes</button>
            </div>
            <div class="filter-group">
                <select onchange="app.filterByStatus(this.value)" id="statusFilter">
                    <option value="">All Status</option>
                    <option value="available">Available</option>
                    <option value="in-use">In Use</option>
                    <option value="maintenance">Maintenance</option>
                </select>
            </div>
        </div>

        <div class="vehicles-grid" id="vehiclesGrid"></div>
    </div>

    <!-- Vehicle Details Modal -->
    <div class="modal" id="vehicleModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle"></span>
                <button class="close-btn" onclick="app.closeModal()">×</button>
            </div>
            <div id="modalBody"></div>
            <div class="tracking-details" id="trackingDetails"></div>
            <div class="qr-display">
                <h3 style="margin-bottom: 16px; color: #333;">Scan QR Code</h3>
                <div id="qrcode"></div>
                <p style="margin-top: 12px; font-size: 0.9em; color: #999;">Linked to Appletag: <strong id="appletag"></strong></p>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px;">
                <button class="btn btn-primary" onclick="app.openBookingForm()">Request Usage</button>
                <button class="btn btn-secondary" onclick="app.openMaintenanceForm()">Log Maintenance</button>
            </div>
        </div>
    </div>

    <!-- Booking Modal -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <div class="modal-header">
                Request Vehicle Usage
                <button class="close-btn" onclick="app.closeBookingModal()">×</button>
            </div>
            <form onsubmit="app.submitBooking(event)">
                <div class="form-group">
                    <label>Vehicle</label>
                    <input type="text" id="bookingVehicle" readonly>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="bookingDate" required>
                </div>
                <div class="form-group">
                    <label>Time (Start)</label>
                    <input type="time" id="bookingTime" required>
                </div>
                <div class="form-group">
                    <label>Duration (hours)</label>
                    <input type="number" id="bookingDuration" min="1" max="8" value="2" required>
                </div>
                <div class="form-group">
                    <label>Destination</label>
                    <input type="text" id="bookingDestination" required>
                </div>
                <div class="form-group">
                    <label>Business Purpose</label>
                    <textarea id="bookingPurpose" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Request</button>
            </form>
        </div>
    </div>

    <!-- Maintenance Modal -->
    <div class="modal" id="maintenanceModal">
        <div class="modal-content">
            <div class="modal-header">
                Log Maintenance
                <button class="close-btn" onclick="app.closeMaintenanceModal()">×</button>
            </div>
            <form onsubmit="app.submitMaintenance(event)">
                <div class="form-group">
                    <label>Vehicle</label>
                    <input type="text" id="maintenanceVehicle" readonly>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="maintenanceDate" required>
                </div>
                <div class="form-group">
                    <label>Maintenance Type</label>
                    <select id="maintenanceType" required>
                        <option value="">Select...</option>
                        <option value="oil-change">Oil Change</option>
                        <option value="tire-rotation">Tire Rotation</option>
                        <option value="inspection">Inspection</option>
                        <option value="repair">Repair</option>
                        <option value="fuel">Fuel/Charge</option>
                        <option value="cleaning">Cleaning</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="maintenanceDesc" required></textarea>
                </div>
                <div class="form-group">
                    <label>Mileage/Hours</label>
                    <input type="number" id="maintenanceMileage" required>
                </div>
                <div class="form-group">
                    <label>Cost ($)</label>
                    <input type="number" id="maintenanceCost" step="0.01" value="0">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Log Maintenance</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/appletag.js"></script>
    <script type="module" src="js/splash.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
