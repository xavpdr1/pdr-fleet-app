<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDR-Team Fleet Tracker</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1F4E79 0%, #2E75B6 100%);
            min-height: 100vh;
            padding: 20px;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 1;
            transition: opacity 0.8s ease-out;
            visibility: visible;
        }

        #splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }

        #splash-logo {
            max-width: 90%;
            max-height: 80vh;
            width: auto;
            height: auto;
            object-fit: contain;
            animation: fadeInScale 0.6s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1F4E79;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        .vehicles-section {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .vehicle-selector {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: fit-content;
        }

        .vehicle-selector h2 {
            font-size: 16px;
            color: #1F4E79;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .vehicle-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .vehicle-btn {
            padding: 16px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-size: 14px;
        }

        .vehicle-btn:hover {
            border-color: #2E75B6;
            background: #F2F4F8;
            transform: translateX(4px);
        }

        .vehicle-btn.active {
            background: #2E75B6;
            color: white;
            border-color: #2E75B6;
            box-shadow: 0 4px 12px rgba(46, 117, 182, 0.4);
        }

        .vehicle-btn-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .vehicle-btn-details {
            font-size: 12px;
            opacity: 0.7;
        }

        .vehicle-detail {
            background: white;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid #B8CCE4;
        }

        .detail-title h2 {
            font-size: 24px;
            color: #1F4E79;
            margin-bottom: 4px;
        }

        .detail-title p {
            color: #6b7280;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-available {
            background: #dcfce7;
            color: #166534;
        }

        .status-in-use {
            background: #fef08a;
            color: #854d0e;
        }

        .status-maintenance {
            background: #fee2e2;
            color: #991b1b;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .info-section {
            padding: 16px;
            background: #D9E1F2;
            border-radius: 8px;
        }

        .section-title {
            font-weight: 600;
            color: #1F4E79;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #6b7280;
            font-weight: 500;
        }

        .info-value {
            color: #1f2937;
            font-weight: 600;
        }

        .alert-section {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 24px;
        }

        .alert-title {
            color: #d97706;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .alert-message {
            color: #92400e;
            font-size: 13px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #B8CCE4;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #2E75B6;
            color: white;
        }

        .btn-primary:hover {
            background: #1F4E79;
            box-shadow: 0 4px 12px rgba(46, 117, 182, 0.3);
        }

        .btn-secondary {
            background: #D9E1F2;
            color: #1F4E79;
        }

        .btn-secondary:hover {
            background: #B8CCE4;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid #B8CCE4;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
            color: #1F4E79;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
        }

        form {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #1F4E79;
            font-weight: 500;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #2E75B6;
            box-shadow: 0 0 0 3px rgba(46, 117, 182, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .qr-display {
            text-align: center;
            padding: 24px;
            background: #F2F4F8;
            border-radius: 8px;
            margin-top: 24px;
        }

        .qr-display h3 {
            margin-bottom: 16px;
            font-size: 14px;
            color: #1F4E79;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .qr-label {
            font-size: 12px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .vehicles-section {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 24px;
            }

            .vehicle-detail {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <img id="splash-logo" src="./logo.png" alt="PDR-Team Fleet Management">
    </div>

    <div class="app-container">
        <header>
            <h1><i class="fas fa-truck"></i> PDR Fleet Tracker</h1>
            <p class="subtitle">Vehicle management, tracking, and maintenance logs</p>
        </header>

        <div class="vehicles-section">
            <!-- Vehicle Selector -->
            <div class="vehicle-selector">
                <h2><i class="fas fa-list"></i> Fleet</h2>
                <div class="vehicle-buttons" id="vehicleButtons"></div>
            </div>

            <!-- Vehicle Details -->
            <div class="vehicle-detail" id="vehicleDetail"></div>
        </div>
    </div>

    <!-- QR Code Page Modal -->
    <div class="modal" id="qrCodeModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3 id="qrModalTitle"></h3>
                <button class="close-btn" onclick="app.closeQRCodeModal()">×</button>
            </div>
            <div style="padding: 24px; text-align: center;">
                <div class="qr-display" style="background: white; border: 2px solid #B8CCE4;">
                    <h3 style="margin-top: 0;">Vehicle QR Code</h3>
                    <div id="qrCodeDisplay" style="padding: 20px; background: #F2F4F8;"></div>
                    <p class="qr-label" style="margin-top: 16px;">Appletag ID: <strong id="qrAppletagId"></strong></p>
                    <p style="color: #6b7280; font-size: 12px; margin-top: 8px;">Scan this code to access vehicle information</p>
                </div>
                <button class="btn btn-secondary" style="margin-top: 20px; width: 100%;" onclick="app.downloadQRCode()">
                    <i class="fas fa-download"></i> Download QR Code
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Vehicle Modal -->
    <div class="modal" id="editVehicleModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Vehicle Information</h3>
                <button class="close-btn" onclick="app.closeEditVehicleModal()">×</button>
            </div>
            <form onsubmit="app.submitEditVehicle(event)">
                <div class="form-group">
                    <label>Vehicle Name</label>
                    <input type="text" id="editVehicleName" required>
                </div>
                <div class="form-group">
                    <label>Model</label>
                    <input type="text" id="editVehicleModel" required>
                </div>
                <div class="form-group">
                    <label>License Plate</label>
                    <input type="text" id="editVehiclePlate" required>
                </div>
                <div class="form-group" id="editVehicleMileageGroup">
                    <label>Current Mileage</label>
                    <input type="number" id="editVehicleMileage" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="editVehicleStatus" required>
                        <option value="available">Available</option>
                        <option value="in-use">In Use</option>
                        <option value="maintenance">Maintenance</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Registration Expiration</label>
                    <input type="date" id="editVehicleReg" required>
                </div>
                <div class="form-group">
                    <label>Next Maintenance Date</label>
                    <input type="date" id="editVehicleNextMaint" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Vehicle Details Modal -->
    <div class="modal" id="vehicleModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button class="close-btn" onclick="app.closeModal()">×</button>
            </div>
            <div id="modalBody"></div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="app.openEditVehicleModal()">Edit Vehicle</button>
                <button class="btn btn-secondary" onclick="app.openMaintenanceForm()">Log Maintenance</button>
            </div>
        </div>
    </div>

    <!-- Booking Modal -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Request Vehicle Usage</h3>
                <button class="close-btn" onclick="app.closeBookingModal()">×</button>
            </div>
            <form onsubmit="app.submitBooking(event)">
                <div class="form-group">
                    <label>Vehicle</label>
                    <input type="text" id="bookingVehicle" readonly>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="bookingDate" required>
                </div>
                <div class="form-group">
                    <label>Time (Start)</label>
                    <input type="time" id="bookingTime" required>
                </div>
                <div class="form-group">
                    <label>Duration (hours)</label>
                    <input type="number" id="bookingDuration" min="1" max="8" value="2" required>
                </div>
                <div class="form-group">
                    <label>Destination</label>
                    <input type="text" id="bookingDestination" required>
                </div>
                <div class="form-group">
                    <label>Business Purpose</label>
                    <textarea id="bookingPurpose" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Request</button>
            </form>
        </div>
    </div>

    <!-- Usage Log Modal -->
    <div class="modal" id="usageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Log Vehicle Usage</h3>
                <button class="close-btn" onclick="app.closeUsageModal()">×</button>
            </div>
            <form onsubmit="app.submitUsageLog(event)">
                <div class="form-group">
                    <label>Vehicle</label>
                    <input type="text" id="usageVehicle" readonly>
                    <input type="hidden" id="usageVehicleId">
                </div>
                <div class="form-group">
                    <label>Driver Name</label>
                    <input type="text" id="usageDriver" required placeholder="Enter driver name">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="usageDate" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" id="usageStartTime" required>
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" id="usageEndTime" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Starting Mileage</label>
                        <input type="number" id="usageStartMileage" required>
                    </div>
                    <div class="form-group">
                        <label>Ending Mileage</label>
                        <input type="number" id="usageEndMileage" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Fuel Added (gal)</label>
                        <input type="number" id="usageFuel" step="0.1" value="0" required>
                    </div>
                    <div class="form-group">
                        <label>Fuel Cost ($)</label>
                        <input type="number" id="usageFuelCost" step="0.01" value="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="usageNotes" placeholder="Trip details, stops, etc."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Log Usage</button>
            </form>
        </div>
    </div>

    <!-- Maintenance Modal -->
    <div class="modal" id="maintenanceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Log Maintenance</h3>
                <button class="close-btn" onclick="app.closeMaintenanceModal()">×</button>
            </div>
            <form onsubmit="app.submitMaintenance(event)">
                <div class="form-group">
                    <label>Vehicle</label>
                    <input type="text" id="maintenanceVehicle" readonly>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="maintenanceDate" required>
                </div>
                <div class="form-group">
                    <label>Maintenance Type</label>
                    <select id="maintenanceType" required>
                        <option value="">Select...</option>
                        <option value="oil-change">Oil Change</option>
                        <option value="tire-rotation">Tire Rotation</option>
                        <option value="inspection">Inspection</option>
                        <option value="repair">Repair</option>
                        <option value="fuel">Fuel/Charge</option>
                        <option value="cleaning">Cleaning</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="maintenanceDesc" required></textarea>
                </div>
                <div class="form-group">
                    <label>Mileage/Hours</label>
                    <input type="number" id="maintenanceMileage" required>
                </div>
                <div class="form-group">
                    <label>Cost ($)</label>
                    <input type="number" id="maintenanceCost" step="0.01" value="0">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Log Maintenance</button>
            </form>
        </div>
    </div>

    <!-- Edit Usage Log Modal -->
    <div class="modal" id="editUsageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Usage Log Entry</h3>
                <button class="close-btn" onclick="app.closeEditUsageModal()">×</button>
            </div>
            <form onsubmit="app.submitEditUsageLog(event)">
                <input type="hidden" id="editUsageLogId">
                <div class="form-group">
                    <label>Driver Name</label>
                    <input type="text" id="editUsageDriver" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="editUsageDate" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" id="editUsageStartTime" required>
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" id="editUsageEndTime" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Starting Mileage</label>
                        <input type="number" id="editUsageStartMileage" required>
                    </div>
                    <div class="form-group">
                        <label>Ending Mileage</label>
                        <input type="number" id="editUsageEndMileage" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Fuel Added (gal)</label>
                        <input type="number" id="editUsageFuel" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Fuel Cost ($)</label>
                        <input type="number" id="editUsageFuelCost" step="0.01">
                    </div>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="editUsageNotes"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        // Handle splash screen fade-out
        document.addEventListener('DOMContentLoaded', function() {
            const splashScreen = document.getElementById('splash-screen');
            if (splashScreen) {
                setTimeout(() => {
                    splashScreen.classList.add('fade-out');
                    setTimeout(() => {
                        splashScreen.remove();
                    }, 800);
                }, 3000);
            }
        });
    </script>

    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/appletag.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
