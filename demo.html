<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDR-Team Fleet Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1F4E79 0%, #2D3847 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: linear-gradient(135deg, rgba(31, 78, 121, 0.95) 0%, rgba(45, 56, 71, 0.95) 100%);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 30px;
            max-width: 900px;
        }

        .logo-section {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            background: transparent;
            padding: 0;
            border-radius: 0;
            border: none;
        }

        .pdr-logo {
            height: 60px;
            width: auto;
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .title-section {
            text-align: left;
        }

        header h1 {
            font-size: 2em;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 0.95em;
            opacity: 0.85;
            line-height: 1.4;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .control-group button {
            padding: 10px 20px;
            border: 2px solid white;
            background: rgba(255,255,255,0.1);
            color: white;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-group button.active {
            background: white;
            color: #1F4E79;
        }

        .control-group button:hover {
            background: rgba(255,255,255,0.2);
        }

        .filter-group {
            display: flex;
            gap: 10px;
        }

        .filter-group select {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: white;
            color: #333;
            font-weight: 600;
            cursor: pointer;
        }

        .vehicles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .vehicle-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .vehicle-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .card-header {
            background: linear-gradient(135deg, #1F4E79 0%, #2E75B6 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .vehicle-name {
            font-size: 1.5em;
            font-weight: 700;
        }

        .vehicle-model {
            color: rgba(255,255,255,0.8);
            font-size: 0.9em;
            margin-top: 4px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-active {
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        .dot-inactive {
            background: #f87171;
        }

        .dot-unknown {
            background: #facc15;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .card-body {
            padding: 24px;
        }

        .info-section {
            margin-bottom: 20px;
        }

        .info-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 0.85em;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95em;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #666;
            font-weight: 500;
        }

        .value {
            color: #333;
            font-weight: 600;
        }

        .tracking-info {
            background: #f8f9fa;
            border-left: 4px solid #1F4E79;
            padding: 12px;
            border-radius: 4px;
            margin: 12px 0;
        }

        .tracking-info .label {
            font-size: 0.85em;
            display: block;
            margin-bottom: 4px;
        }

        .tracking-info .value {
            font-size: 0.95em;
        }

        .location-badge {
            display: inline-block;
            background: #D9E1F2;
            color: #1F4E79;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 8px;
        }

        .battery-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .battery-bar {
            width: 40px;
            height: 8px;
            background: #ddd;
            border-radius: 4px;
            overflow: hidden;
        }

        .battery-fill {
            height: 100%;
            background: #4ade80;
            border-radius: 4px;
        }

        .battery-fill.low {
            background: #f87171;
        }

        .battery-fill.medium {
            background: #facc15;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-primary {
            background: #1F4E79;
            color: white;
        }

        .btn-primary:hover {
            background: #2E75B6;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            font-size: 1.8em;
            font-weight: 700;
            color: #333;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.8em;
            cursor: pointer;
            color: #999;
            padding: 0;
        }

        .close-btn:hover {
            color: #333;
        }

        .qr-display {
            text-align: center;
            margin: 24px 0;
            padding: 24px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .tracking-details {
            background: #F2F4F8;
            padding: 16px;
            border-radius: 8px;
            margin: 16px 0;
        }

        .tracking-details h4 {
            color: #1F4E79;
            margin-bottom: 12px;
        }

        .tracking-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(31, 78, 121, 0.1);
        }

        .tracking-detail-row:last-child {
            border-bottom: none;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1em;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state i {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.1em;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .title-section {
                text-align: center;
            }

            .pdr-logo {
                font-size: 1.6em;
            }

            header h1 {
                font-size: 1.6em;
            }

            header p {
                font-size: 0.9em;
            }

            .vehicles-grid {
                grid-template-columns: 1fr;
            }

            .card-actions {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }

            .control-group button {
                flex: 1;
            }
        }
    </style>
</head>

        <div class="controls">
            <div class="control-group">
                <button class="active" onclick="app.switchView('all')"><i class="fas fa-th"></i> All Vehicles</button>
                <button onclick="app.switchView('active')"><i class="fas fa-map-marker-alt"></i> Active</button>
                <button onclick="app.switchView('tracked')"><i class="fas fa-signal"></i> Tracked</button>
                <button onclick="app.switchView('qronly')"><i class="fas fa-qrcode"></i> QR Codes</button>
            </div>
            <div class="filter-group">
                <select onchange="app.filterByStatus(this.value)" id="statusFilter">
                    <option value="">All Status</option>
                    <option value="available">Available</option>
                    <option value="in-use">In Use</option>
                    <option value="maintenance">Maintenance</option>
                </select>
            </div>
        </div>

        <div class="vehicles-grid" id="vehiclesGrid"></div>
    </div>

    <!-- Vehicle Details Modal -->
    <div class="modal" id="vehicleModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle"></span>
                <button class="close-btn" onclick="app.closeModal()">×</button>
            </div>
            <div id="modalBody"></div>
            <div class="tracking-details" id="trackingDetails"></div>
            <div class="qr-display">
                <h3 style="margin-bottom: 16px; color: #333;">Scan QR Code</h3>
                <div id="qrcode"></div>
                <p style="margin-top: 12px; font-size: 0.9em; color: #999;">Linked to Appletag: <strong id="appletag"></strong></p>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px;">
                <button class="btn btn-primary" onclick="app.openBookingForm()">Request Usage</button>
                <button class="btn btn-secondary" onclick="app.openMaintenanceForm()">Log Maintenance</button>
            </div>
        </div>
    </div>

    <!-- Booking Modal -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <div class="modal-header">
                Request Vehicle Usage
                <button class="close-btn" onclick="app.closeBookingModal()">×</button>
            </div>
            <form onsubmit="app.submitBooking(event)">
                <div class="form-group">
                    <label>Vehicle</label>
                    <input type="text" id="bookingVehicle" readonly>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="bookingDate" required>
                </div>
                <div class="form-group">
                    <label>Time (Start)</label>
                    <input type="time" id="bookingTime" required>
                </div>
                <div class="form-group">
                    <label>Duration (hours)</label>
                    <input type="number" id="bookingDuration" min="1" max="8" value="2" required>
                </div>
                <div class="form-group">
                    <label>Destination</label>
                    <input type="text" id="bookingDestination" required>
                </div>
                <div class="form-group">
                    <label>Business Purpose</label>
                    <textarea id="bookingPurpose" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Request</button>
            </form>
        </div>
    </div>

    <!-- Maintenance Modal -->
    <div class="modal" id="maintenanceModal">
        <div class="modal-content">
            <div class="modal-header">
                Log Maintenance
                <button class="close-btn" onclick="app.closeMaintenanceModal()">×</button>
            </div>
            <form onsubmit="app.submitMaintenance(event)">
                <div class="form-group">
                    <label>Vehicle</label>
                    <input type="text" id="maintenanceVehicle" readonly>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="maintenanceDate" required>
                </div>
                <div class="form-group">
                    <label>Maintenance Type</label>
                    <select id="maintenanceType" required>
                        <option value="">Select...</option>
                        <option value="oil-change">Oil Change</option>
                        <option value="tire-rotation">Tire Rotation</option>
                        <option value="inspection">Inspection</option>
                        <option value="repair">Repair</option>
                        <option value="fuel">Fuel/Charge</option>
                        <option value="cleaning">Cleaning</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="maintenanceDesc" required></textarea>
                </div>
                <div class="form-group">
                    <label>Mileage/Hours</label>
                    <input type="number" id="maintenanceMileage" required>
                </div>
                <div class="form-group">
                    <label>Cost ($)</label>
                    <input type="number" id="maintenanceCost" step="0.01" value="0">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Log Maintenance</button>
            </form>
        </div>
    </div>

                { id: 'truck-2', name: 'Truck 2', model: '2021 Chevrolet Silverado', licensePlate: 'PDR-2202', vin: 'XXXXXX2345678901C2', assignedTo: 'Service Lead', capacity: '5 seats', primaryUse: 'Site visits, equipment transport', mileage: 52100, status: 'in-use', lastMaintenance: '2026-08-20', nextMaintenance: '2026-09-20', appletag: 'APT-002-TRK2' },
                { id: 'van-1', name: 'Van', model: '2023 Ford Transit', licensePlate: 'PDR-2203', vin: 'XXXXXX3456789012V3', assignedTo: 'Technician pool', capacity: '2 seats + cargo', primaryUse: 'Material transport, training', mileage: 12450, status: 'available', lastMaintenance: '2026-09-10', nextMaintenance: '2026-10-10', appletag: 'APT-003-VAN' },
                { id: 'sedan-1', name: 'Sedan 1', model: '2020 Toyota Camry', licensePlate: 'PDR-2204', vin: 'XXXXXX4567890123S4', assignedTo: 'Admin/Office', capacity: '5 seats', primaryUse: 'Local office travel, meetings', mileage: 78900, status: 'available', lastMaintenance: '2026-09-01', nextMaintenance: '2026-10-01', appletag: 'APT-004-SD1' },
                { id: 'sedan-2', name: 'Sedan 2', model: '2021 Nissan Altima', licensePlate: 'PDR-2205', vin: 'XXXXXX5678901234N5', assignedTo: 'Admin/Office', capacity: '5 seats', primaryUse: 'Local office travel, meetings', mileage: 65400, status: 'maintenance', lastMaintenance: '2026-08-15', nextMaintenance: '2026-09-30', appletag: 'APT-005-SD2' }
            ],
            currentVehicle: null,
            currentView: 'all',
            statusFilter: '',
            tracking: {},

            async init() {
                for (const vehicle of this.vehicles) {
                    const tracking = await appletag.getTracking(vehicle.appletag);
                    this.tracking[vehicle.id] = tracking;
                }
                this.renderVehicles();
                setInterval(() => {
                    this.loadTrackingData().then(() => {
                        if (this.currentView !== 'qronly') {
                            this.renderVehicles();
                        }
                    });
                }, 30000);
            },

            async loadTrackingData() {
                for (const vehicle of this.vehicles) {
                    const tracking = await appletag.getTracking(vehicle.appletag);
                    this.tracking[vehicle.id] = tracking;
                }
            },

            renderVehicles() {
                const grid = document.getElementById('vehiclesGrid');
                grid.innerHTML = '';

                let filtered = this.vehicles.filter(v => {
                    if (this.statusFilter && v.status !== this.statusFilter) return false;
                    if (this.currentView === 'active') return v.status === 'in-use';
                    if (this.currentView === 'tracked') {
                        const tracking = this.tracking[v.id];
                        return tracking && tracking.status === 'active';
                    }
                    if (this.currentView === 'qronly') return true;
                    return true;
                });

                if (filtered.length === 0) {
                    grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><i class="fas fa-inbox"></i><p>No vehicles found</p></div>';
                    return;
                }

                filtered.forEach(vehicle => {
                    if (this.currentView === 'qronly') {
                        this.renderQRCard(vehicle);
                    } else {
                        this.renderVehicleCard(vehicle);
                    }
                });
            },

            renderVehicleCard(vehicle) {
                const grid = document.getElementById('vehiclesGrid');
                const card = document.createElement('div');
                card.className = 'vehicle-card';
                card.onclick = () => this.openVehicleModal(vehicle);

                const tracking = this.tracking[vehicle.id] || {};
                const statusColor = this.getStatusColor(vehicle.status);
                const statusText = vehicle.status.replace('-', ' ').toUpperCase();
                const batteryPercent = tracking.battery || 0;
                const batteryColor = this.getBatteryColor(batteryPercent);
                const trackingStatus = this.getTrackingStatus(vehicle);

                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="vehicle-name">${vehicle.name}</div>
                            <div class="vehicle-model">${vehicle.model}</div>
                        </div>
                        <div class="status-badge">${trackingStatus}</div>
                    </div>
                    <div class="card-body">
                        <div class="info-section">
                            <div class="section-title">Vehicle Info</div>
                            <div class="info-row">
                                <span class="label">License Plate:</span>
                                <span class="value">${vehicle.licensePlate}</span>
                            </div>
                            <div class="info-row">
                                <span class="label">Appletag ID:</span>
                                <span class="value" style="color: #667eea; font-family: monospace;">${vehicle.appletag}</span>
                            </div>
                            <div class="info-row">
                                <span class="label">Mileage:</span>
                                <span class="value">${vehicle.mileage.toLocaleString()} mi</span>
                            </div>
                        </div>

                        <div class="info-section">
                            <div class="section-title">Status</div>
                            <div class="info-row">
                                <span class="label">Vehicle Status:</span>
                                <span class="value" style="color: ${statusColor};">${statusText}</span>
                            </div>
                            <div class="info-row">
                                <span class="label">Next Service:</span>
                                <span class="value">${vehicle.nextMaintenance}</span>
                            </div>
                        </div>

                        <div class="info-section">
                            <div class="section-title">Tracking</div>
                            <div class="tracking-info">
                                <div class="label">Current Location:</div>
                                <div class="value">${tracking.location || 'Unknown'}</div>
                                <div class="location-badge"><i class="fas fa-map-marker-alt"></i> ${tracking.latitude?.toFixed(4) || 'N/A'}, ${tracking.longitude?.toFixed(4) || 'N/A'}</div>
                            </div>
                            <div class="info-row">
                                <span class="label">Battery:</span>
                                <span class="value">
                                    <div class="battery-indicator">
                                        <div class="battery-bar">
                                            <div class="battery-fill ${batteryColor}" style="width: ${batteryPercent}%"></div>
                                        </div>
                                        ${batteryPercent}%
                                    </div>
                                </span>
                            </div>
                        </div>
                    </div>
                    <div style="padding: 0 24px 24px;">
                        <div class="card-actions">
                            <button class="btn btn-primary" onclick="event.stopPropagation(); app.openVehicleModal(app.vehicles.find(v => v.id === '${vehicle.id}'))">View Details</button>
                            <button class="btn btn-secondary" onclick="event.stopPropagation()">Show QR</button>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            },

            renderQRCard(vehicle) {
                const grid = document.getElementById('vehiclesGrid');
                const card = document.createElement('div');
                card.className = 'vehicle-card';
                card.style.cursor = 'auto';

                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="vehicle-name">${vehicle.name}</div>
                            <div class="vehicle-model">${vehicle.licensePlate}</div>
                        </div>
                    </div>
                    <div class="card-body" style="text-align: center;">
                        <div id="qr-${vehicle.id}" style="display: flex; justify-content: center; margin: 16px 0;"></div>
                        <div style="font-size: 0.9em; color: #999; margin-top: 12px;">
                            <div><strong>Appletag:</strong> ${vehicle.appletag}</div>
                        </div>
                    </div>
                `;

                grid.appendChild(card);

                setTimeout(() => {
                    const qrUrl = `${window.location.href}?vehicle=${vehicle.id}&appletag=${vehicle.appletag}`;
                    new QRCode(document.getElementById(`qr-${vehicle.id}`), {
                        text: qrUrl,
                        width: 150,
                        height: 150,
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }, 100);
            },

            async openVehicleModal(vehicle) {
                this.currentVehicle = vehicle;
                const modal = document.getElementById('vehicleModal');
                const title = document.getElementById('modalTitle');
                const body = document.getElementById('modalBody');
                const tracking = document.getElementById('trackingDetails');
                const appletag = document.getElementById('appletag');

                const trackingData = this.tracking[vehicle.id] || {};
                const statusColor = this.getStatusColor(vehicle.status);
                const statusText = vehicle.status.replace('-', ' ').toUpperCase();
                const batteryPercent = trackingData.battery || 0;

                title.textContent = `${vehicle.name} (${vehicle.licensePlate})`;

                body.innerHTML = `
                    <div class="info-section">
                        <div class="section-title">Vehicle Information</div>
                        <div class="info-row">
                            <span class="label">Model:</span>
                            <span class="value">${vehicle.model}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">VIN:</span>
                            <span class="value">${vehicle.vin}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Assigned to:</span>
                            <span class="value">${vehicle.assignedTo}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Capacity:</span>
                            <span class="value">${vehicle.capacity}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Mileage:</span>
                            <span class="value">${vehicle.mileage.toLocaleString()} miles</span>
                        </div>
                    </div>

                    <div class="info-section">
                        <div class="section-title">Maintenance</div>
                        <div class="info-row">
                            <span class="label">Last Service:</span>
                            <span class="value">${vehicle.lastMaintenance}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Next Service:</span>
                            <span class="value">${vehicle.nextMaintenance}</span>
                        </div>
                    </div>

                    <div class="info-section">
                        <div class="section-title">Status</div>
                        <div class="info-row">
                            <span class="label">Vehicle Status:</span>
                            <span class="value" style="color: ${statusColor};">${statusText}</span>
                        </div>
                    </div>
                `;

                tracking.innerHTML = `
                    <h4><i class="fas fa-satellite"></i> Appletag Tracking (${vehicle.appletag})</h4>
                    <div class="tracking-detail-row">
                        <span>Location:</span>
                        <strong>${trackingData.location || 'Unknown'}</strong>
                    </div>
                    <div class="tracking-detail-row">
                        <span>Coordinates:</span>
                        <strong>${trackingData.latitude?.toFixed(4) || 'N/A'}, ${trackingData.longitude?.toFixed(4) || 'N/A'}</strong>
                    </div>
                    <div class="tracking-detail-row">
                        <span>Last Seen:</span>
                        <strong>${trackingData.lastSeen || 'N/A'}</strong>
                    </div>
                    <div class="tracking-detail-row">
                        <span>Battery:</span>
                        <strong>${batteryPercent}%</strong>
                    </div>
                    <div class="tracking-detail-row">
                        <span>Signal Strength:</span>
                        <strong>${trackingData.signal || 'Unknown'}</strong>
                    </div>
                `;

                appletag.textContent = vehicle.appletag;

                setTimeout(() => {
                    const qrContainer = document.getElementById('qrcode');
                    qrContainer.innerHTML = '';
                    const qrUrl = `${window.location.href}?vehicle=${vehicle.id}&appletag=${vehicle.appletag}`;
                    new QRCode(qrContainer, {
                        text: qrUrl,
                        width: 200,
                        height: 200,
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }, 100);

                modal.classList.add('active');
            },

            closeModal() {
                document.getElementById('vehicleModal').classList.remove('active');
            },

            openBookingForm() {
                if (!this.currentVehicle) return;
                document.getElementById('bookingVehicle').value = this.currentVehicle.name;
                document.getElementById('bookingModal').classList.add('active');
            },

            closeBookingModal() {
                document.getElementById('bookingModal').classList.remove('active');
            },

            async submitBooking(event) {
                event.preventDefault();

                const booking = {
                    vehicle_id: this.currentVehicle.id,
                    vehicle_name: document.getElementById('bookingVehicle').value,
                    date: document.getElementById('bookingDate').value,
                    time: document.getElementById('bookingTime').value,
                    duration: parseInt(document.getElementById('bookingDuration').value),
                    destination: document.getElementById('bookingDestination').value,
                    purpose: document.getElementById('bookingPurpose').value
                };

                if (supabase.initialized) {
                    await supabase.createBooking(booking);
                } else {
                    await supabase.saveBookingLocal(booking);
                }

                alert(`✓ Booking request submitted for ${booking.vehicle_name}\nYour manager will respond shortly.`);
                this.closeBookingModal();
                event.target.reset();
            },

            openMaintenanceForm() {
                if (!this.currentVehicle) return;
                document.getElementById('maintenanceVehicle').value = this.currentVehicle.name;
                document.getElementById('maintenanceModal').classList.add('active');
            },

            closeMaintenanceModal() {
                document.getElementById('maintenanceModal').classList.remove('active');
            },

            async submitMaintenance(event) {
                event.preventDefault();

                const maintenance = {
                    vehicle_id: this.currentVehicle.id,
                    vehicle_name: document.getElementById('maintenanceVehicle').value,
                    date: document.getElementById('maintenanceDate').value,
                    type: document.getElementById('maintenanceType').value,
                    description: document.getElementById('maintenanceDesc').value,
                    mileage: parseInt(document.getElementById('maintenanceMileage').value),
                    cost: parseFloat(document.getElementById('maintenanceCost').value)
                };

                if (supabase.initialized) {
                    await supabase.createMaintenance(maintenance);
                } else {
                    await supabase.saveMaintenanceLocal(maintenance);
                }

                alert(`✓ Maintenance logged for ${maintenance.vehicle_name}\nType: ${maintenance.type}`);
                this.closeMaintenanceModal();
                event.target.reset();
            },

            switchView(view) {
                this.currentView = view;
                const buttons = document.querySelectorAll('.control-group button');
                buttons.forEach(btn => btn.classList.remove('active'));
                event.target.closest('button').classList.add('active');
                this.renderVehicles();
            },

            filterByStatus(status) {
                this.statusFilter = status;
                this.renderVehicles();
            },

            getStatusColor(status) {
                const colors = {
                    'available': '#4ade80',
                    'in-use': '#facc15',
                    'maintenance': '#f87171'
                };
                return colors[status] || '#999';
            },

            getBatteryColor(battery) {
                if (battery >= 60) return 'green';
                if (battery >= 30) return 'medium';
                return 'low';
            },

            getTrackingStatus(vehicle) {
                const tracking = this.tracking[vehicle.id];
                if (!tracking) return `<span class="status-dot dot-unknown"></span>Unknown`;
                if (tracking.status === 'active') {
                    return `<span class="status-dot dot-active"></span>Active`;
                } else {
                    return `<span class="status-dot dot-inactive"></span>Inactive`;
                }
            }
        };

        // Initialize when ready
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
